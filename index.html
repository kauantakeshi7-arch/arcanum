<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --void:#07080C;
  --panel:#111320;
  --panel-2:#171A2A;
  --panel-3:#1D2033;
  --line:rgba(212,168,83,0.16);
  --line-soft:rgba(212,168,83,0.09);
  --gold:#D4A853;
  --gold-soft:#E8C989;
  --violet:#8B6CF2;
  --violet-soft:#B3A0F7;
  --emerald:#34C79A;
  --text-hi:#F2EEE4;
  --text-mid:#ADA8C0;
  --text-low:#8783A0;
  --danger:#C15C5C;
  --font-display:'Cormorant Garamond', serif;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  font-family:var(--font-body);
  color:var(--text-hi);
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
input,textarea,select{font-family:inherit; color:inherit;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--violet-soft); outline-offset:2px; border-radius:4px;
}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

/* ============ RESPONSIVE APP SHELL ============
   Mobile (<760px):  full-bleed single column, bottom tab bar.
   Tablet (>=760px): left icon+label sidebar replaces bottom bar.
   Desktop (>=1080px): + right widgets panel, three-column layout. */
.app-shell{
  width:100%;
  max-width:1240px;
  height:100vh;
  height:100dvh;
  background:
    radial-gradient(ellipse 700px 400px at 15% -5%, rgba(139,108,242,0.14), transparent 60%),
    radial-gradient(ellipse 600px 400px at 100% 15%, rgba(52,199,154,0.09), transparent 60%),
    radial-gradient(ellipse 800px 600px at 50% 110%, rgba(212,168,83,0.07), transparent 60%),
    var(--void);
  display:flex;
  position:relative;
  overflow:hidden;
}
.main-col{
  flex:1; min-width:0;
  display:flex; flex-direction:column;
  height:100%; position:relative;
}
.side-nav{
  display:none; flex-direction:column;
  width:230px; flex-shrink:0; height:100%;
  padding:22px 12px; gap:2px;
  border-right:1px solid var(--line);
  overflow-y:auto;
}
.side-nav .brand{padding:6px 12px 26px;}
.side-nav-btn{
  display:flex; align-items:center; gap:14px;
  padding:12px 14px; border-radius:12px;
  color:var(--text-mid); font-size:14.5px; font-weight:500;
  text-align:left; width:100%;
}
.side-nav-btn svg{width:21px; height:21px; flex-shrink:0;}
.side-nav-btn.active{color:var(--gold-soft); background:rgba(212,168,83,0.09);}
.side-nav-btn:hover{background:rgba(212,168,83,0.06);}
.side-nav-fab{
  margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  background:linear-gradient(120deg, var(--gold), var(--gold-soft));
  color:#22160a; font-weight:700; font-size:13.5px;
  padding:12px; border-radius:12px;
}
.side-nav-fab svg{width:17px; height:17px;}
.side-nav-audio{
  margin-top:auto; display:flex; align-items:center; gap:9px;
  border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--text-mid);
}
.side-nav-audio.playing{color:var(--emerald); border-color:rgba(52,199,154,0.35);}

.right-panel{
  display:none; width:300px; flex-shrink:0; height:100%;
  padding:22px 16px; border-left:1px solid var(--line); overflow-y:auto;
}
.widget-card{
  background:linear-gradient(175deg, var(--panel), var(--panel-2)); border:1px solid var(--line);
  border-radius:14px; padding:15px; margin-bottom:14px; transition:border-color .2s;
}
@media (hover:hover){ .widget-card:hover{border-color:rgba(212,168,83,0.3);} }
.widget-title{font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:11px;
  background:linear-gradient(120deg, var(--gold-soft), var(--violet-soft)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.widget-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12.5px; color:var(--text-mid);}
.widget-freqs{display:flex; gap:6px; flex-wrap:wrap;}
.widget-freq-btn{border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:11.5px; color:var(--text-mid);}
.widget-freq-btn.active{color:var(--emerald); border-color:rgba(52,199,154,0.4);}

@media (min-width:760px){
  .main-col{ border-left:1px solid var(--line-soft); }
  .side-nav{ display:flex; }
  .bottom-nav{ display:none !important; }
  .fab{ bottom:24px; }
  .mini-player{ bottom:16px; }
}
@media (min-width:1080px){
  .right-panel{ display:block; }
}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
  position:relative;
  z-index:20;
}
.brand{display:flex; align-items:center; gap:8px;}
.brand-mark{width:24px; height:24px; flex-shrink:0;}
.brand-mark svg{width:100%; height:100%; filter:drop-shadow(0 0 5px rgba(212,168,83,0.45));}
@media (prefers-reduced-motion: no-preference){
  .brand-mark svg{animation:slow-spin 40s linear infinite;}
}
@keyframes slow-spin{to{transform:rotate(360deg);}}
.brand-name{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:600;
  font-size:22px;
  background:linear-gradient(120deg, var(--gold-soft), var(--gold) 60%, var(--violet-soft));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  letter-spacing:0.3px;
}
.topbar-actions{display:flex; align-items:center; gap:14px;}
.icon-btn{position:relative; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-mid); transition:color .2s, background .2s;}
.icon-btn:hover{background:rgba(212,168,83,0.08); color:var(--gold-soft);}
.icon-btn:active{color:var(--gold-soft); transform:scale(0.92);}
.icon-btn svg{width:19px; height:19px;}
.badge-dot{
  position:absolute; top:-1px; right:-2px;
  background:var(--violet); color:#fff;
  font-size:9px; font-weight:700;
  min-width:14px; height:14px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  padding:0 3px;
  box-shadow:0 0 0 2px var(--void);
}
.audio-chip{
  display:flex; align-items:center; gap:5px;
  border:1px solid var(--line); border-radius:20px;
  padding:5px 9px 5px 7px;
  font-size:11px; color:var(--text-mid);
  transition:box-shadow .3s, border-color .3s;
}
.audio-chip.playing{color:var(--emerald); border-color:rgba(52,199,154,0.4); box-shadow:0 0 12px rgba(52,199,154,0.25);}
.eq-bars{display:flex; align-items:flex-end; gap:1.5px; height:11px;}
.eq-bars span{width:2px; background:var(--text-low); border-radius:1px; height:3px;}
.audio-chip.playing .eq-bars span{background:var(--emerald);}
@media (prefers-reduced-motion: no-preference){
  .audio-chip.playing .eq-bars span:nth-child(1){animation:eq 0.9s ease-in-out infinite;}
  .audio-chip.playing .eq-bars span:nth-child(2){animation:eq 0.7s ease-in-out infinite .1s;}
  .audio-chip.playing .eq-bars span:nth-child(3){animation:eq 1.1s ease-in-out infinite .05s;}
}
@keyframes eq{0%,100%{height:3px;} 50%{height:11px;}}

/* ---------- STORIES ---------- */
.stories{
  display:flex; gap:14px; padding:14px 16px; overflow-x:auto; flex-shrink:0;
  border-bottom:1px solid var(--line);
}
.story{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:60px;}
.story-ring{
  width:56px; height:56px; border-radius:50%;
  padding:2.5px;
  background:conic-gradient(from 210deg, var(--gold), var(--violet), var(--emerald), var(--gold));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px -2px rgba(212,168,83,0.35);
  transition:transform .2s;
}
.story:active .story-ring{transform:scale(0.94);}
.story-ring.seen{background:var(--panel-3); box-shadow:none;}
.story-avatar{
  width:100%; height:100%; border-radius:50%;
  background:linear-gradient(155deg, var(--panel-3), var(--panel-2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--gold-soft);
  border:2px solid var(--void);
}
.story-add .story-ring{background:var(--panel-2); border:1px dashed rgba(212,168,83,0.5); box-shadow:none;}
.story-add .story-avatar{background:transparent; color:var(--gold-soft); font-size:20px; font-weight:400;}
.story-name{font-size:10px; color:var(--text-mid); max-width:60px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- SCREENS ---------- */
.screens{flex:1; min-height:0; position:relative;}
.screen{
  position:absolute; inset:0;
  overflow-y:auto;
  padding:16px 16px 100px;
  display:none;
}
.screen.active{display:block;}
.section-head{margin-bottom:14px;}
.section-title{font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--text-hi);}
.section-sub{font-size:12.5px; color:var(--text-low); margin-top:2px;}

/* Feed tabs */
.feed-tabs{display:flex; gap:8px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--line);}
.feed-tab{
  padding:7px 14px; font-size:12.5px; color:var(--text-low); font-weight:600;
  border-radius:20px; border:1px solid transparent; transition:background .2s, color .2s, border-color .2s;
}
.feed-tab.active{
  color:var(--gold-soft);
  background:linear-gradient(120deg, rgba(212,168,83,0.16), rgba(139,108,242,0.10));
  border-color:rgba(212,168,83,0.35);
  box-shadow:0 2px 10px rgba(212,168,83,0.12);
}

/* Cards */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px 16px 16px 5px;
  padding:14px;
  margin-bottom:12px;
  transition:transform .2s, border-color .2s, box-shadow .2s;
  position:relative;
  overflow:hidden;
}
@media (hover:hover){
  .card:hover{transform:translateY(-2px); border-color:var(--line); box-shadow:0 10px 28px rgba(0,0,0,0.35);}
}
.post-accent{position:absolute; top:0; left:0; right:0; height:2.5px;}
.post-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.avatar-sm{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:14px;
  color:var(--void);
}
.post-meta{flex:1; min-width:0;}
.post-name{font-size:13.5px; font-weight:600; color:var(--text-hi);}
.post-sub{display:flex; align-items:center; gap:6px; margin-top:1px;}
.trad-badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:500; padding:2px 7px 2px 6px;
  border-radius:20px; border:1px solid;
}
.post-time{font-size:11px; color:var(--text-low);}
.post-text{font-size:13.5px; line-height:1.55; color:var(--text-mid); white-space:pre-wrap; margin-bottom:10px;}
.altar-photo{
  height:150px; border-radius:12px; margin-bottom:10px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.oracle-cards-row{display:flex; gap:8px; margin-bottom:10px;}
.mini-tarot{
  flex:1; aspect-ratio:2/3; border-radius:8px; border:1px solid rgba(212,168,83,0.3);
  background:linear-gradient(160deg, var(--panel-3), var(--panel-2));
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-display); font-size:11px; padding:4px; color:var(--gold-soft);
  box-shadow:0 0 0 1px rgba(212,168,83,0.08) inset, 0 4px 10px rgba(0,0,0,0.25);
}
.reaction-bar{display:flex; align-items:center; gap:6px; padding-top:10px; border-top:1px solid var(--line-soft);}
.reaction-btn{
  display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-low);
  padding:6px 9px; border-radius:20px; transition:color .15s, transform .15s, background .2s;
}
.reaction-btn svg{width:16px; height:16px;}
@media (hover:hover){ .reaction-btn:hover{background:rgba(255,255,255,0.05); color:var(--text-mid);} }
.reaction-btn.active{color:var(--gold-soft); background:rgba(212,168,83,0.12);}
.reaction-btn.active.repost{color:var(--emerald); background:rgba(52,199,154,0.12);}
.reaction-btn.active.save{color:var(--violet-soft); background:rgba(139,108,242,0.14);}
.reaction-btn:active{transform:scale(0.88);}
.reaction-btn.grow{margin-left:auto;}

.comments-box{margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft);}
.comment-line{font-size:12px; color:var(--text-mid); margin-bottom:6px;}
.comment-line b{color:var(--text-hi); font-weight:600;}
.comment-input-row{display:flex; gap:8px; margin-top:6px;}
.comment-input-row input{
  flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:20px;
  padding:7px 12px; font-size:12px; color:var(--text-hi);
}
.comment-input-row button{color:var(--violet-soft); font-size:12px; font-weight:600; padding:0 4px;}

/* ---------- NOTIFICATIONS / DMs ---------- */
.notif-unread{position:relative; padding-left:12px;}
.notif-unread::before{content:''; position:absolute; left:0; top:6px; width:6px; height:6px; border-radius:50%; background:var(--violet);}
.dm-convo-row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:10px 4px; border-radius:12px; transition:background .15s;
}
.dm-convo-row:hover, .dm-convo-row:active{background:rgba(255,255,255,0.03);}
.dm-convo-info{flex:1; min-width:0;}
.dm-convo-name{font-size:13px; font-weight:600; color:var(--text-hi);}
.dm-convo-preview{font-size:11.5px; color:var(--text-low); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dm-convo-time{font-size:10px; color:var(--text-low); flex-shrink:0;}
.dm-messages{
  display:flex; flex-direction:column; gap:8px; max-height:340px; min-height:120px;
  overflow-y:auto; padding:4px 2px; margin-bottom:10px;
}
.dm-bubble{
  max-width:78%; padding:8px 12px; border-radius:14px 14px 14px 4px;
  background:var(--panel-2); border:1px solid var(--line); font-size:13px; color:var(--text-hi);
  align-self:flex-start; line-height:1.4; white-space:pre-wrap; word-break:break-word;
}
.dm-bubble.me{
  align-self:flex-end; border-radius:14px 14px 4px 14px;
  background:linear-gradient(135deg, rgba(139,108,242,0.28), rgba(139,108,242,0.14));
  border-color:rgba(139,108,242,0.35);
}

/* FAB */
.fab{
  position:absolute; right:16px; bottom:92px; z-index:15;
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(145deg, var(--violet), #6647c9);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(139,108,242,0.4), 0 0 0 1px rgba(255,255,255,0.06) inset;
  transition:transform .15s;
}
.fab::before{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  border:1px solid rgba(139,108,242,0.4); pointer-events:none;
}
@media (prefers-reduced-motion: no-preference){
  .fab::before{animation:fab-pulse 2.6s ease-out infinite;}
}
@keyframes fab-pulse{0%{transform:scale(0.85); opacity:0.9;} 100%{transform:scale(1.35); opacity:0;}}
.fab:active{transform:scale(0.92);}
.fab svg{width:22px; height:22px; color:#fff;}

/* ---------- TRILHAS ---------- */
.tree-wrap{position:relative; padding-left:6px; margin-top:6px;}
.tree-wrap::before{
  content:''; position:absolute; left:27px; top:10px; bottom:10px; width:2px;
  background:linear-gradient(var(--emerald), var(--gold) 40%, var(--line) 65%, transparent);
  opacity:0.7;
}
.tree-node{display:flex; align-items:center; gap:14px; margin-bottom:22px; position:relative;}
.node-dot{
  width:56px; height:56px; border-radius:50%; flex-shrink:0; z-index:2;
  display:flex; align-items:center; justify-content:center; font-size:22px;
  border:1.5px solid var(--line); background:var(--panel);
  transition:transform .15s;
}
.node-dot:not(:disabled):active{transform:scale(0.93);}
.node-dot.done{background:linear-gradient(145deg, var(--emerald), #1e8a68); border-color:transparent; color:#fff; box-shadow:0 0 0 3px rgba(52,199,154,0.15), 0 4px 14px rgba(52,199,154,0.3);}
.node-dot.locked{opacity:0.38; background:var(--panel-2);}
.node-dot.locked svg{width:18px; height:18px;}
.node-dot.current{
  border-color:var(--gold); color:var(--gold-soft);
  background:linear-gradient(155deg, rgba(212,168,83,0.18), var(--panel));
  box-shadow:0 0 0 3px rgba(212,168,83,0.15), 0 4px 18px rgba(212,168,83,0.35);
}
.node-dot.current::before{
  content:''; position:absolute; inset:-5px; border-radius:50%;
  border:1.5px solid rgba(212,168,83,0.5);
}
@media (prefers-reduced-motion: no-preference){
  .node-dot.current::before{animation:fab-pulse 2.4s ease-out infinite;}
}
.node-info{flex:1;}
.node-title{font-size:14px; font-weight:600; color:var(--text-hi);}
.node-sub{font-size:11.5px; color:var(--text-low); margin-top:2px;}
.node-xp{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; color:var(--gold-soft); margin-top:5px; font-weight:700;
  padding:2px 8px; border-radius:10px; background:rgba(212,168,83,0.1); border:1px solid rgba(212,168,83,0.25);
}
.node-xp.done-tag{color:var(--emerald); background:rgba(52,199,154,0.1); border-color:rgba(52,199,154,0.25);}

.duel-card{
  position:relative;
  margin-top:8px; padding:20px 18px; border-radius:18px;
  background:linear-gradient(145deg, rgba(139,108,242,0.18), rgba(52,199,154,0.08));
  border:1px solid rgba(139,108,242,0.35);
  box-shadow:0 12px 34px rgba(139,108,242,0.12);
  text-align:center;
  overflow:hidden;
}
.duel-card::before{
  content:''; position:absolute; top:-40%; left:50%; transform:translateX(-50%);
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,168,83,0.18), transparent 65%);
  pointer-events:none;
}
.duel-card .section-title{font-size:19px; position:relative;}
.duel-icon{width:22px; height:22px; vertical-align:-5px; margin-right:2px; filter:drop-shadow(0 0 6px rgba(212,168,83,0.5));}
.btn-primary{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  background:linear-gradient(120deg, var(--gold), var(--gold-soft));
  color:#22160a; font-weight:700; font-size:13.5px;
  padding:11px 22px; border-radius:12px; margin-top:12px;
  box-shadow:0 6px 20px rgba(212,168,83,0.3);
}
@media (prefers-reduced-motion: no-preference){
  .btn-primary::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.35) 35%, transparent 50%);
    transform:translateX(-120%);
    animation:btn-sheen 4.5s ease-in-out infinite;
  }
}
.btn-ghost{
  border:1px solid var(--line); border-radius:12px; padding:10px 18px;
  font-size:13px; color:var(--text-mid); font-weight:600;
}
.leaderboard{margin-top:16px; text-align:left; position:relative;}
.lb-row{display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; margin-bottom:2px; font-size:12.5px; transition:background .2s;}
.lb-rank{
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--text-low); background:var(--panel-3);
}
.lb-rank.gold{background:linear-gradient(145deg, #E8C989, #B4832F); color:#2a1c05;}
.lb-rank.silver{background:linear-gradient(145deg, #DADFE8, #9AA3B5); color:#22262f;}
.lb-rank.bronze{background:linear-gradient(145deg, #D79A6B, #9C5F34); color:#2a1806;}
.lb-name{flex:1; color:var(--text-mid);}
.lb-name.me{color:var(--gold-soft); font-weight:700;}
.lb-row.me-row{background:rgba(212,168,83,0.08); border:1px solid rgba(212,168,83,0.25);}
.lb-mana{color:var(--emerald); font-weight:600;}

/* ---------- SANTUARIO ---------- */
.altar-scene{
  position:relative; height:210px; border-radius:18px; margin-bottom:14px;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(212,168,83,0.14), transparent 65%),
    radial-gradient(ellipse 200px 120px at 85% 10%, rgba(139,108,242,0.14), transparent 70%),
    var(--panel);
  border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(212,168,83,0.05) inset, 0 14px 34px rgba(0,0,0,0.3);
  display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
}
.swatches{display:flex; gap:12px; margin-bottom:16px; padding-left:2px;}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; box-shadow:0 2px 8px rgba(0,0,0,0.3); transition:transform .15s;}
.swatch:active{transform:scale(0.88);}
.swatch.active{border-color:var(--text-hi); box-shadow:0 0 0 3px rgba(255,255,255,0.08), 0 2px 10px rgba(0,0,0,0.4);}

.streak-row{
  display:flex; align-items:center; gap:12px; margin-bottom:14px; padding:12px 14px; border-radius:14px;
  background:linear-gradient(135deg, rgba(212,168,83,0.10), var(--panel)); border:1px solid var(--line);
}
.streak-flame{
  font-size:22px; width:38px; height:38px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, rgba(212,168,83,0.28), transparent 70%);
}
.streak-num{font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--gold-soft);}
.streak-label{font-size:11.5px; color:var(--text-low);}

.grim-entry{
  padding:12px 0 12px 12px; margin-bottom:2px; border-bottom:1px solid var(--line-soft);
  border-left:2px solid var(--grim-c, var(--line)); border-radius:0 8px 8px 0;
  transition:background .15s;
}
@media (hover:hover){ .grim-entry:hover{background:rgba(255,255,255,0.02);} }
.grim-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.grim-type{font-size:9.5px; font-weight:700; letter-spacing:0.3px; padding:2px 7px; border-radius:8px; text-transform:lowercase;}
.grim-date{font-size:10.5px; color:var(--text-low); margin-left:auto;}
.grim-title{font-size:13.5px; font-weight:600; color:var(--text-hi); margin-bottom:2px;}
.grim-snippet{font-size:12px; color:var(--text-mid); line-height:1.5;}

.form-field{margin-bottom:12px;}
.form-field label{display:block; font-size:11.5px; color:var(--text-low); margin-bottom:6px; font-weight:500;}
.form-field input, .form-field textarea, .form-field select{
  width:100%; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; font-size:13.5px; color:var(--text-hi);
}
.form-field textarea{resize:none; min-height:80px; line-height:1.5;}
.char-count{font-size:10.5px; color:var(--text-low); text-align:right; margin-top:4px;}

.oracle-flip-wrap{perspective:1000px; margin-bottom:6px;}
.oracle-flip{
  position:relative; height:170px; border-radius:16px;
  transform-style:preserve-3d; transition:transform .7s cubic-bezier(.4,.2,.2,1);
}
.oracle-flip.flipped{transform:rotateY(180deg);}
.oracle-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--line); padding:16px; text-align:center;
  box-shadow:0 10px 26px rgba(0,0,0,0.3);
}
.oracle-front{background:linear-gradient(155deg, var(--panel-3), var(--panel));}
@media (prefers-reduced-motion: no-preference){
  .oracle-front svg{animation:slow-spin 60s linear infinite;}
}
.oracle-back{
  background:linear-gradient(155deg, rgba(139,108,242,0.2), rgba(212,168,83,0.12)), var(--panel);
  border-color:rgba(212,168,83,0.35);
  transform:rotateY(180deg);
}

.sigil-tools{
  position:relative; overflow:hidden;
  background:linear-gradient(175deg, var(--panel), var(--panel-2)); border:1px solid var(--line);
  border-radius:16px; padding:14px; margin-bottom:14px;
}
#sigilCanvas{width:100%; height:180px; border-radius:12px; background:var(--void); border:1px solid var(--line); touch-action:none; display:block;}
.sigil-actions{display:flex; gap:10px; margin-top:10px;}

/* ---------- EGREGORA ---------- */
.affinity-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft);}
.affinity-avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:13px; color:#fff;
}
.affinity-pct{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--emerald); width:44px; text-align:right;}
.affinity-info{flex:1;}
.affinity-name{font-size:13px; font-weight:600;}
.affinity-signs{font-size:10.5px; color:var(--text-low); margin-top:1px;}
.affinity-bar-track{height:4px; border-radius:2px; background:var(--panel-3); margin-top:6px; overflow:hidden;}
.affinity-bar-fill{height:100%; background:linear-gradient(90deg, var(--emerald), var(--gold-soft)); border-radius:2px; box-shadow:0 0 8px rgba(52,199,154,0.4);}

.candle-item{display:flex; gap:12px; padding:12px 10px; margin-bottom:2px; border-radius:12px; align-items:center; transition:background .15s;}
@media (hover:hover){ .candle-item:hover{background:rgba(255,255,255,0.02);} }
.candle-flame-mini{
  font-size:17px; flex-shrink:0; width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, rgba(212,168,83,0.25), transparent 70%);
}
.candle-body{flex:1;}
.candle-intention{font-size:12.5px; color:var(--text-mid); line-height:1.4;}
.candle-lights{font-size:11px; color:var(--gold-soft); margin-top:3px; font-weight:600;}
.light-btn{
  flex-shrink:0; font-size:11px; font-weight:600; color:var(--gold-soft);
  border:1px solid rgba(212,168,83,0.35); border-radius:20px; padding:7px 12px;
  transition:background .2s, transform .15s;
}
.light-btn.active{background:rgba(212,168,83,0.14); box-shadow:0 0 10px rgba(212,168,83,0.2);}
.light-btn:active{transform:scale(0.94);}

.moon-card{
  position:relative; overflow:hidden;
  border-radius:18px; padding:18px; margin-bottom:14px;
  background:radial-gradient(circle at 85% 15%, rgba(212,168,83,0.22), transparent 55%), var(--panel);
  border:1px solid rgba(212,168,83,0.25);
  box-shadow:0 14px 34px rgba(0,0,0,0.28);
}
.moon-countdown{font-family:var(--font-display); font-size:28px; font-weight:600; color:var(--gold-soft); margin:6px 0 10px; text-shadow:0 0 18px rgba(212,168,83,0.35);}
.toggle-pill{display:inline-flex; align-items:center; gap:8px; font-size:12px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); color:var(--text-mid); transition:background .2s, border-color .2s;}
.toggle-pill.on{color:var(--emerald); border-color:rgba(52,199,154,0.4); background:rgba(52,199,154,0.08); box-shadow:0 0 10px rgba(52,199,154,0.18);}

.market-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
.market-item{flex-shrink:0; width:118px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; transition:transform .15s, border-color .15s;}
@media (hover:hover){ .market-item:hover{transform:translateY(-2px); border-color:rgba(212,168,83,0.3);} }
.market-thumb{height:70px; border-radius:9px; margin-bottom:8px;}
.market-name{font-size:11.5px; font-weight:600; line-height:1.3; margin-bottom:3px;}
.market-price{font-size:12px; color:var(--gold-soft); font-weight:700;}

/* ---------- PERFIL ---------- */
.profile-top{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:18px;}
.avatar-stage{position:relative; width:150px; height:150px; margin-bottom:12px; display:flex; align-items:center; justify-content:center;}
.aura-glow{position:absolute; inset:-10px; border-radius:50%; filter:blur(18px); opacity:0.55;}
@media (prefers-reduced-motion: no-preference){
  .aura-glow{animation:pulse-aura 3.6s ease-in-out infinite;}
}
@keyframes pulse-aura{0%,100%{opacity:0.4; transform:scale(1);} 50%{opacity:0.7; transform:scale(1.08);}}
.avatar-svg{position:relative; z-index:2; width:130px; height:130px; filter:drop-shadow(0 8px 20px rgba(0,0,0,0.4));}
.profile-name{font-family:var(--font-display); font-size:24px; font-weight:600;}
.profile-grade{font-size:12.5px; color:var(--gold-soft); margin-top:2px; font-weight:600;}
.familiar-tag{font-size:11px; color:var(--text-low); margin-top:4px;}
.mana-bar-wrap{width:100%; margin-top:14px;}
.mana-bar-track{height:6px; border-radius:3px; background:var(--panel-3); overflow:hidden;}
.mana-bar-fill{
  position:relative; height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--violet), var(--emerald));
  box-shadow:0 0 10px rgba(139,108,242,0.4);
  overflow:hidden;
}
@media (prefers-reduced-motion: no-preference){
  .mana-bar-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
    transform:translateX(-100%);
    animation:btn-sheen 3.2s ease-in-out infinite;
  }
}
.mana-nums{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-low); margin-top:5px;}

.tradition-select-wrap{width:100%; margin-top:14px;}
.subtabs{display:flex; gap:8px; margin:18px 0 12px; padding-bottom:12px; border-bottom:1px solid var(--line);}
.subtab{
  padding:7px 14px; font-size:12.5px; color:var(--text-low); font-weight:600;
  border-radius:20px; border:1px solid transparent; transition:background .2s, color .2s, border-color .2s;
}
.subtab.active{
  color:var(--gold-soft);
  background:linear-gradient(120deg, rgba(212,168,83,0.16), rgba(139,108,242,0.10));
  border-color:rgba(212,168,83,0.35);
  box-shadow:0 2px 10px rgba(212,168,83,0.12);
}
.subtab.active::after{display:none;}
.grid-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:3px;}
.grid-photo{aspect-ratio:1; border-radius:3px; transition:transform .15s, opacity .15s;}
@media (hover:hover){ .grid-photo:hover{transform:scale(0.96); opacity:0.85;} }
.reflection-item{padding:12px 0; border-bottom:1px solid var(--line-soft); font-size:13px; color:var(--text-mid); line-height:1.5;}
.reflection-date{font-size:10.5px; color:var(--text-low); margin-bottom:4px;}

/* ---------- BOTTOM NAV & MINI PLAYER ---------- */
.mini-player{
  position:absolute; left:12px; right:12px; bottom:76px; z-index:14;
  background:rgba(23,26,42,0.92); backdrop-filter:blur(10px);
  border:1px solid var(--line); border-radius:14px;
  padding:9px 12px; display:none; align-items:center; gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.mini-player.show{display:flex;}
.mini-player .eq-bars{height:14px;}
.mini-player .eq-bars span{background:var(--emerald);}
.mini-player-info{flex:1; min-width:0;}
.mini-player-title{font-size:12px; font-weight:600; color:var(--text-hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-player-sub{font-size:10px; color:var(--text-low);}
.mini-player-btn{width:30px; height:30px; border-radius:50%; background:var(--panel-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.mini-player-btn svg{width:14px; height:14px;}

.bottom-nav{
  position:relative; z-index:20;
  display:flex; justify-content:space-around; align-items:center;
  padding:9px 6px 12px;
  background:rgba(17,19,32,0.85); backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  flex-shrink:0;
}
.nav-btn{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-low); position:relative; padding:4px 10px;}
.nav-btn svg{width:21px; height:21px;}
.nav-btn span{font-size:9.5px; font-weight:500;}
.nav-btn.active{color:var(--gold-soft);}
.nav-btn.active::before{
  content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--gold-soft);
}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:absolute; inset:0; background:rgba(3,4,8,0.72); backdrop-filter:blur(2px);
  display:none; align-items:flex-end; z-index:50;
}
.modal-overlay.show{display:flex;}
.modal-sheet{
  width:100%; max-height:88%; overflow-y:auto; position:relative;
  background:var(--panel); border:1px solid var(--line); border-bottom:none;
  border-radius:22px 22px 0 0; padding:18px 18px 26px;
  animation:sheet-up .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheet-up{from{transform:translateY(100%);} to{transform:translateY(0);}}
@media (min-width:760px){
  .modal-overlay{ align-items:center; justify-content:center; }
  .modal-sheet{
    width:92%; max-width:440px; max-height:80vh;
    border-radius:20px; border-bottom:1px solid var(--line);
    animation:dialog-in .22s cubic-bezier(.2,.8,.2,1);
  }
  .modal-handle{ display:none; }
}
@keyframes dialog-in{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-handle{width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 16px;}
.modal-title{font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:14px; padding-right:24px;}
.modal-close-x{position:absolute; top:16px; right:16px; color:var(--text-low); width:26px; height:26px; display:flex; align-items:center; justify-content:center; z-index:2;}
.modal-close-x svg{width:18px; height:18px;}

.quiz-q{margin-bottom:16px;}
.quiz-q-text{font-size:14px; font-weight:600; margin-bottom:10px; line-height:1.4;}
.quiz-opt{
  display:block; width:100%; text-align:left; padding:11px 13px; margin-bottom:8px;
  border:1px solid var(--line); border-radius:11px; font-size:13px; color:var(--text-mid);
}
.quiz-opt.correct{border-color:var(--emerald); background:rgba(52,199,154,0.12); color:var(--emerald);}
.quiz-opt.wrong{border-color:var(--danger); background:rgba(193,92,92,0.12); color:var(--danger);}
.quiz-opt:disabled{pointer-events:none;}

/* ---------- TOASTS ---------- */
.toast-wrap{position:absolute; top:70px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none;}
.toast{
  background:rgba(23,26,42,0.95); border:1px solid var(--line); color:var(--text-hi);
  font-size:12.5px; font-weight:500; padding:9px 16px; border-radius:20px;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
  animation:toast-in .25s ease-out, toast-out .3s ease-in 1.9s forwards;
}
@keyframes toast-in{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
@keyframes toast-out{to{opacity:0; transform:translateY(-10px);}}

.empty-hint{font-size:12px; color:var(--text-low); text-align:center; padding:20px 0;}

/* ---------- AUTH GATE ---------- */
.auth-screen{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse 800px 500px at 12% -8%, rgba(139,108,242,0.20), transparent 60%),
    radial-gradient(ellipse 700px 500px at 105% 10%, rgba(52,199,154,0.13), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 115%, rgba(212,168,83,0.11), transparent 60%),
    var(--void);
  padding:20px;
  overflow:hidden;
}
.auth-stars{
  position:absolute; inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.55), transparent),
    radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 75%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 12% 80%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1.5px 1.5px at 35% 45%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 60% 88%, rgba(255,255,255,0.3), transparent);
  background-repeat:no-repeat;
  opacity:0.7;
}
.auth-particles{position:absolute; inset:0; pointer-events:none;}
.auth-particles span{
  position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
  background:var(--gold-soft); opacity:0;
  box-shadow:0 0 6px 1px rgba(212,168,83,0.6);
}
@media (prefers-reduced-motion: no-preference){
  .auth-particles span{animation:drift-up 9s linear infinite;}
  .auth-particles span:nth-child(1){left:8%; animation-delay:0s; animation-duration:11s;}
  .auth-particles span:nth-child(2){left:22%; animation-delay:2.2s; animation-duration:8s; background:var(--violet-soft); box-shadow:0 0 6px 1px rgba(139,108,242,0.6);}
  .auth-particles span:nth-child(3){left:40%; animation-delay:4.5s; animation-duration:12s;}
  .auth-particles span:nth-child(4){left:63%; animation-delay:1.2s; animation-duration:9.5s; background:var(--emerald); box-shadow:0 0 6px 1px rgba(52,199,154,0.55);}
  .auth-particles span:nth-child(5){left:80%; animation-delay:3.6s; animation-duration:10.5s;}
  .auth-particles span:nth-child(6){left:93%; animation-delay:5.8s; animation-duration:8.5s; background:var(--violet-soft); box-shadow:0 0 6px 1px rgba(139,108,242,0.6);}
}
@keyframes drift-up{
  0%{transform:translateY(0) scale(0.6); opacity:0;}
  10%{opacity:0.9;}
  90%{opacity:0.5;}
  100%{transform:translateY(-92vh) scale(1); opacity:0;}
}
.auth-sigil-wrap{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:560px; height:560px; pointer-events:none; opacity:0.5;
}
.auth-sigil{width:100%; height:100%;}
@media (prefers-reduced-motion: no-preference){
  .auth-sigil-wrap{animation:auth-sigil-spin 90s linear infinite;}
}
@keyframes auth-sigil-spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
@media (max-width:520px){.auth-sigil-wrap{width:400px; height:400px;}}

.auth-card{
  position:relative; z-index:2;
  width:100%; max-width:380px;
  background:linear-gradient(175deg, rgba(23,26,42,0.92), rgba(17,19,32,0.94));
  backdrop-filter:blur(6px);
  border:1px solid var(--line);
  border-radius:22px;
  padding:34px 26px 28px;
  box-shadow:0 30px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
}
.auth-corner{position:absolute; width:20px; height:20px; opacity:0.75; pointer-events:none;}
.auth-corner.tl{top:10px; left:10px; border-top:1.5px solid var(--gold); border-left:1.5px solid var(--gold); border-radius:6px 0 0 0;}
.auth-corner.tr{top:10px; right:10px; border-top:1.5px solid var(--gold); border-right:1.5px solid var(--gold); border-radius:0 6px 0 0;}
.auth-corner.bl{bottom:10px; left:10px; border-bottom:1.5px solid var(--gold); border-left:1.5px solid var(--gold); border-radius:0 0 0 6px;}
.auth-corner.br{bottom:10px; right:10px; border-bottom:1.5px solid var(--gold); border-right:1.5px solid var(--gold); border-radius:0 0 6px 0;}

.auth-emblem{display:flex; justify-content:center; margin-bottom:14px;}
.auth-emblem svg{width:46px; height:46px; filter:drop-shadow(0 0 10px rgba(212,168,83,0.35));}
@media (prefers-reduced-motion: no-preference){
  .auth-emblem svg{animation:slow-spin 50s linear infinite;}
}
.auth-brand{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:30px; text-align:center; margin-bottom:5px; letter-spacing:0.3px;
  background:linear-gradient(120deg, var(--gold-soft), var(--gold) 55%, var(--violet-soft)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.auth-sub{text-align:center; font-size:12.5px; color:var(--text-low); margin-bottom:24px; line-height:1.5;}
.auth-tabs{display:flex; gap:4px; margin-bottom:20px; padding:4px; background:rgba(0,0,0,0.25); border:1px solid var(--line-soft); border-radius:14px;}
.auth-tab{flex:1; text-align:center; padding:9px 4px; font-size:13px; color:var(--text-low); font-weight:600; border-radius:10px; transition:color .2s, background .2s;}
.auth-tab.active{color:#1a1206; background:linear-gradient(120deg, var(--gold), var(--gold-soft)); box-shadow:0 4px 14px rgba(212,168,83,0.3);}
.auth-tab.active::after{display:none;}
.auth-error{font-size:12px; color:var(--danger); margin-bottom:10px; min-height:14px; text-align:center;}
.auth-field label{font-size:11px; letter-spacing:0.4px; text-transform:uppercase; color:var(--text-low);}
.auth-input-wrap{position:relative;}
.auth-input-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--text-low); pointer-events:none;}
.auth-card .form-field input{
  padding-left:38px;
  background:rgba(0,0,0,0.28);
  border:1px solid var(--line);
  transition:border-color .2s, box-shadow .2s;
}
.auth-input-wrap.has-toggle input{padding-right:38px;}
.auth-pw-toggle{

  width:28px; height:28px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-low); transition:color .2s, background .2s;
}
.auth-pw-toggle svg{width:17px; height:17px;}
.auth-pw-toggle:hover{color:var(--gold-soft); background:rgba(212,168,83,0.08);}
.auth-field-hint{font-size:10.5px; margin-top:5px; min-height:13px; color:var(--text-low);}
.auth-field-hint.error{color:var(--danger);}
.auth-field-hint.success{color:var(--emerald);}
.auth-input-wrap.invalid input{border-color:var(--danger);}
.auth-input-wrap.invalid input:focus{box-shadow:0 0 0 3px rgba(193,92,92,0.14);}
.auth-input-wrap.valid input{border-color:var(--emerald);}
.auth-input-wrap.valid input:focus{box-shadow:0 0 0 3px rgba(52,199,154,0.14);}
.pw-strength{margin-top:9px;}
.pw-strength-bars{display:flex; gap:4px;}
.pw-strength-bars span{flex:1; height:4px; border-radius:2px; background:var(--panel-3); transition:background .25s;}
.pw-strength-bars span.f-weak{background:var(--danger);}
.pw-strength-bars span.f-fair{background:#C1874A;}
.pw-strength-bars span.f-good{background:var(--gold-soft);}
.pw-strength-bars span.f-strong{background:var(--emerald);}
.pw-strength-label{font-size:10.5px; margin-top:5px; font-weight:600; color:var(--text-low);}
.auth-card .form-field input:focus{

}
.auth-submit-btn{position:relative; overflow:hidden; margin-top:6px; box-shadow:0 6px 22px rgba(212,168,83,0.32);}
@media (prefers-reduced-motion: no-preference){
  .auth-submit-btn::after{

/* ---------------- AUDIO (Web Audio, tons reais) ---------------- */
function toggleAudio(freqOverride){
  const a = state.audio;
  if(freqOverride) a.freq = freqOverride.hz, a.label = freqOverride.label;
  if(!a.ctx){ a.ctx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(a.playing && !freqOverride){
    stopAudio();
  } else {
    if(a.osc){ try{a.osc.stop();}catch(e){} }
    const osc = a.ctx.createOscillator();
    const gain = a.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = a.freq;
    gain.gain.value = 0;
    osc.connect(gain).connect(a.ctx.destination);
    osc.start();
    gain.gain.linearRampToValueAtTime(0.05, a.ctx.currentTime + 0.4);
    a.osc = osc; a.gain = gain; a.playing = true;
  }
  renderAudioUI();
}
function stopAudio(){
  const a = state.audio;
  if(a.osc && a.gain){
    a.gain.gain.linearRampToValueAtTime(0, a.ctx.currentTime + 0.3);
    const osc = a.osc;
    setTimeout(()=>{ try{osc.stop();}catch(e){} }, 320);
  }
  a.playing = false;
}
function renderAudioUI(){
  const chip = document.getElementById('audioChip');
  const label = document.getElementById('audioChipLabel');
  label.textContent = state.audio.label;
  chip.classList.toggle('playing', state.audio.playing);
  const mini = document.getElementById('miniPlayer');
  mini.classList.toggle('show', state.audio.playing);
  document.getElementById('miniTitle').textContent = 'Templo Sonoro · ' + state.audio.label;
  document.getElementById('miniPlayIcon').innerHTML = state.audio.playing
    ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  const sideChip = document.getElementById('sideAudioChip');
  const sideLabel = document.getElementById('sideAudioLabel');
  if(sideChip && sideLabel){
    sideLabel.textContent = 'Templo Sonoro · ' + state.audio.label;
    sideChip.classList.toggle('playing', state.audio.playing);
  }
}

function openQuiz(moduleId){
  const mod = state.trilhas.find(m=>m.id===moduleId);
  const qs = state.quizzes[moduleId];
  let currentQ = 0, correctCount = 0;
  function renderQuiz(){
    const q = qs[currentQ];
    openModal(`
      <div class="modal-title">${mod.title}</div>
      <div class="node-sub" style="margin-bottom:14px">Pergunta ${currentQ+1} de ${qs.length}</div>
      <div class="quiz-q">
        <div class="quiz-q-text">${q.q}</div>
        ${q.opts.map((o,i)=>`<button class="quiz-opt" data-opt="${i}">${o}</button>`).join('')}
      </div>
    `);
    document.querySelectorAll('[data-opt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const chosen = parseInt(btn.dataset.opt);
        document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);
        if(chosen===q.correct){ btn.classList.add('correct'); correctCount++; }
        else{
          btn.classList.add('wrong');
          document.querySelector(`[data-opt="${q.correct}"]`).classList.add('correct');
        }
        setTimeout(()=>{
          currentQ++;
          if(currentQ<qs.length) renderQuiz();
          else finishQuiz();
        }, 900);
      });
    });
  }
  function finishQuiz(){
    const earned = Math.round(mod.xp * (correctCount/qs.length));
    mod.done = true;
    state.profile.mana_xp += earned;
    updateProfile(state.profile.id, {mana_xp: state.profile.mana_xp}).catch(console.error);
    openModal(`
      <div class="modal-title">Módulo concluído ✦</div>
      <div class="node-sub" style="margin-bottom:16px">Você acertou ${correctCount} de ${qs.length} perguntas.</div>
      <div style="text-align:center; padding:10px 0">
        <div style="font-family:var(--font-display); font-size:34px; color:var(--gold-soft)">+${earned}</div>
        <div class="node-sub">Mana de Sabedoria</div>
      </div>
      <button class="btn-primary" style="width:100%" data-action="close-modal">Continuar</button>
    `);
    renderAll();
  }
  renderQuiz();
}

// Shared pointer state for the sigil canvas. Bound to window ONCE (below, outside
// this function) so re-rendering Santuário never stacks duplicate listeners.
const sigilPointer = {drawing:false, last:null, ctx:null};
window.addEventListener('mouseup', ()=>{ sigilPointer.drawing = false; });
window.addEventListener('touchend', ()=>{ sigilPointer.drawing = false; });
window.addEventListener('touchcancel', ()=>{ sigilPointer.drawing = false; });

let sigilResizeObserver = null;
function paintSigilCanvas(canvas){
  const dpr = window.devicePixelRatio||1;
  canvas.width = canvas.clientWidth*dpr; canvas.height = canvas.clientHeight*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.strokeStyle = '#B3A0F7'; ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor = '#8B6CF2'; ctx.shadowBlur = 8;
  sigilPointer.ctx = ctx;
}
function setupSigilCanvas(){
  const canvas = document.getElementById('sigilCanvas');
  if(!canvas) return;
  paintSigilCanvas(canvas);

  // Re-fit the drawing surface if the panel is resized (e.g. rotating a phone,
  // or resizing a desktop window). The in-progress sigil is cleared on resize,
  // which is an acceptable trade-off for a scratch drawing surface.
  if(sigilResizeObserver) sigilResizeObserver.disconnect();
  sigilResizeObserver = new ResizeObserver(()=>{ paintSigilCanvas(canvas); });
  sigilResizeObserver.observe(canvas);

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-r.left, y: t.clientY-r.top};
  }
  function start(e){ sigilPointer.drawing=true; sigilPointer.last=pos(e); e.preventDefault(); }
  function move(e){
    if(!sigilPointer.drawing) return;
    const p = pos(e);
    const ctx = sigilPointer.ctx;
    ctx.beginPath(); ctx.moveTo(sigilPointer.last.x,sigilPointer.last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    sigilPointer.last = p; e.preventDefault();
  }
  // These are bound to the canvas element itself, which is discarded and recreated
  // on every render (innerHTML rewrite), so old bindings never linger.
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false});
  const ctx = sigilPointer.ctx;

  document.getElementById('btnClearSigil').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
  });
  document.getElementById('btnActivateSigil').addEventListener('click', ()=>{
    const intention = document.getElementById('sigilIntention').value.trim();
    // particle burst
    const cx = canvas.clientWidth/2, cy = canvas.clientHeight/2;
    let particles = Array.from({length:26}, ()=>({
      x:cx, y:cy, a:Math.random()*Math.PI*2, s:1+Math.random()*3, life:1
    }));
    let frame=0;
    const burst = setInterval(()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x += Math.cos(p.a)*p.s; p.y += Math.sin(p.a)*p.s; p.life -= 0.04;
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.fillStyle = '#D4A853';
        ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      frame++;
      if(frame>26){ clearInterval(burst); ctx.clearRect(0,0,canvas.width,canvas.height); }
    }, 30);
    toast(intention ? `Sigilo de "${intention}" ativado ✦` : 'Sigilo ativado ✦');
    document.getElementById('sigilIntention').value='';
  });
}

document.addEventListener('click', (e)=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ setNav(nav.dataset.nav); return; }

  const feedtab = e.target.closest('[data-feedtab]');
  if(feedtab){ state.feedTab = feedtab.dataset.feedtab; renderAgora(); return; }

  const act = e.target.closest('[data-action]');
  if(act){
    const action = act.dataset.action;
    const id = act.dataset.id;

    if(action==='like'){
      const post = state.posts.find(p=>p.id===id);
      const wasLiked = post.liked;
      post.liked = !wasLiked; post.blessings += post.liked?1:-1;
      renderAgora();

      if(post.liked && post.userId){
        api.createNotification(post.userId, state.profile.id, 'like', post.id).catch(console.error);
      }
      call.catch(err=>{
        post.liked = wasLiked; post.blessings += wasLiked?1:-1;
        toast('Não foi possível salvar sua reação. Tente de novo.');
        renderAgora();
        console.error(err);
      });
    }
    else if(action==='repost'){
      // Reposts have no backing table yet (see README "Próximas extensões") — local-only for now.
      const post = state.posts.find(p=>p.id===id);
      post.reposted = !post.reposted; post.reposts += post.reposted?1:-1;
      renderAgora();
    }
    else if(action==='save'){
      // "Guardar no grimório" as a bookmark also has no table yet — local-only for now.
      const post = state.posts.find(p=>p.id===id);
      post.saved = !post.saved;
      toast(post.saved ? 'Guardado no seu Grimório ✦' : 'Removido do Grimório');
      renderAgora();
    }
    else if(action==='toggle-comments'){
      const post = state.posts.find(p=>p.id===id);
      post._showComments = !post._showComments;

          post.comments = rows.map(r=>({n: r.profiles?.display_name || 'Alguém', t: r.content}));
          post._commentsLoaded = true;
          renderAgora();
        }).catch(err=>{ toast('Não foi possível carregar os comentários.'); console.error(err); });

    else if(action==='send-comment'){
      const input = document.querySelector(`[data-comment-input="${id}"]`);

      if(val){
        const post = state.posts.find(p=>p.id===id);

          post.comments.push({n: state.profile.display_name, t: val});

        }).catch(err=>{ toast('Não foi possível enviar o comentário.'); console.error(err); });

async function openDmThread(conversationId, otherId, otherName){
  stopDmThreadSub();
  state.openDmConversationId = conversationId;
  openModal(`<div class="modal-title">${escapeHtml(otherName)}</div>
    <div id="dmMessages" class="dm-messages"></div>
    <div class="comment-input-row"><input type="text" id="dmInput" placeholder="Escreva com respeito…" autocomplete="off"><button id="dmSendBtn">Enviar</button></div>`);
  const box = document.getElementById('dmMessages');
  async function renderMessages(){
    if(!box.isConnected) return;
    const rows = await api.fetchMessages(conversationId);
    box.innerHTML = rows.length ? rows.map(m=>
      `<div class="dm-bubble ${m.sender_id===state.profile.id?'me':''}">${escapeHtml(m.content)}</div>`
    ).join('') : '<div class="empty-hint">Nenhuma mensagem ainda. Diga olá ✦</div>';
    box.scrollTop = box.scrollHeight;
  }
  try{
    await renderMessages();
    await api.markMessagesRead(conversationId, state.profile.id);
    refreshBadgeCounts();
  }catch(err){ console.error(err); }
  dmThreadUnsub = api.subscribeToMessages(conversationId, (msg)=>{
    if(msg.sender_id !== state.profile.id){
      renderMessages();
      api.markMessagesRead(conversationId, state.profile.id).then(refreshBadgeCounts).catch(console.error);
    }
  });
  async function send(){
    const input = document.getElementById('dmInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    try{
      await api.sendMessage(conversationId, state.profile.id, text);
      await renderMessages();
      api.createNotification(otherId, state.profile.id, 'message', conversationId).catch(console.error);
    }catch(err){ console.error(err); toast('Não foi possível enviar a mensagem.'); }
  }
  document.getElementById('dmSendBtn').addEventListener('click', send);
  document.getElementById('dmInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
}

/* =========================================================
   AUTH GATE + DATA LOADING (real Supabase wiring)
   ========================================================= */
function relativeTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'agora';
  if(mins < 60) return `há ${mins}min`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `há ${hours}h`;
  return `há ${Math.floor(hours/24)}d`;
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}

async function loadAppData(userId){
  await ensureProfileLoaded(userId);
  const [posts, myLikes, grimoire, candles, myLights] = await Promise.all([

  ]);
  state.myLikedPostIds = myLikes;

    blessings: row.blessings_count,
    reposts: 0,
    saved: false,
    liked: myLikes.has(row.id),
    comments: [],

  }));
  state.grimoire = grimoire.map(row => ({
    id: row.id, type: row.entry_type, title: row.title, content: row.content, date: shortDate(row.created_at)

async function boot(){
  let session;
  try { session = await getSession(); }
  catch(err){ console.error(err); session = null; }

  if(!session){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
    return;
  }

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  try{
    // A session can exist here without a profiles row yet — e.g. the user
    // confirmed their e-mail via the link and landed back with a session
    // Supabase created automatically, bypassing signIn()/signUp() (the only
    // two places that used to call ensureProfile). Always ensure it first.
    const meta = session.user.user_metadata || {};
    await ensureProfile(session.user.id, {
      username: meta.username || (session.user.email.split('@')[0] + '.' + session.user.id.slice(0, 4)),
      display_name: meta.display_name || session.user.email.split('@')[0]
    });
    await loadAppData(session.user.id);
    renderAll();
    refreshBadgeCounts();
    if(window.__notifUnsub) window.__notifUnsub();
    window.__notifUnsub = api.subscribeToNotifications(session.user.id, ()=>{ refreshBadgeCounts(); });
  }catch(err){
    console.error(err);
    toast('Não foi possível carregar seus dados do Supabase. Veja o console.');
  }
}

// ---- Password strength meter (signup only) ----
function passwordScore(pw){
  let score = 0;
  if(pw.length >= 6) score++;
  if(pw.length >= 10) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(/\d/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  return Math.min(score, 4);
}
function updatePasswordStrength(){
  const pw = document.getElementById('authPassword').value;
  const bars = document.querySelectorAll('#pwStrengthBars span');
  const label = document.getElementById('pwStrengthLabel');
  if(!pw){ bars.forEach(b=>b.className=''); label.textContent = ''; return; }
  const score = passwordScore(pw);
  const filled = Math.max(1, score);
  const tier = score<=1 ? 'weak' : score===2 ? 'fair' : score===3 ? 'good' : 'strong';
  const cls = {weak:'f-weak', fair:'f-fair', good:'f-good', strong:'f-strong'}[tier];
  bars.forEach((b,i)=>{ b.className = i<filled ? cls : ''; });
  const labels = {weak:'Fraca', fair:'Razoável', good:'Boa', strong:'Forte'};
  const colors = {weak:'var(--danger)', fair:'#C1874A', good:'var(--gold-soft)', strong:'var(--emerald)'};
  label.textContent = 'Força da senha: ' + labels[tier];
  label.style.color = colors[tier];
}
document.getElementById('authPassword').addEventListener('input', ()=>{
  updatePasswordStrength();
  if(authMode==='signup') validateConfirmField();
});

// ---- Confirm password match (signup only) ----
function validateConfirmField(){
  const input = document.getElementById('authConfirmPassword');
  const wrap = input.closest('.auth-input-wrap');
  const hint = document.getElementById('authConfirmHint');
  const pw = document.getElementById('authPassword').value;
  const cpw = input.value;
  wrap.classList.remove('valid','invalid');
  hint.className = 'auth-field-hint';
  if(!cpw){ hint.textContent = ''; return; }
  if(cpw === pw){ wrap.classList.add('valid'); hint.textContent = ''; }
  else { wrap.classList.add('invalid'); hint.classList.add('error'); hint.textContent = 'As senhas não coincidem.'; }
}
document.getElementById('authConfirmPassword').addEventListener('input', validateConfirmField);

// Supabase Auth error messages come back in English — translate the common
// ones so the whole login/signup flow reads in Portuguese like the rest of the app.
function translateAuthError(message){
  if(!message) return 'Não foi possível autenticar. Tente novamente.';
  const m = message.toLowerCase();
  const waitMatch = message.match(/after (\d+) seconds?/i);
  if(waitMatch) return `Por segurança, aguarde ${waitMatch[1]} segundos e tente de novo.`;
  if(m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if(m.includes('already registered') || m.includes('already exists')) return 'Este e-mail já está cadastrado. Tente entrar.';
  if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar — verifique sua caixa de entrada.';
  if(m.includes('password should be at least') || m.includes('password is too short')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('unable to validate email address') || m.includes('invalid email')) return 'Digite um e-mail válido.';
  if(m.includes('email rate limit exceeded')) return 'Muitas tentativas com este e-mail. Aguarde alguns minutos e tente de novo.';
  if(m.includes('user not found')) return 'Não encontramos uma conta com esse e-mail.';
  if(m.includes('network') || m.includes('fetch')) return 'Falha de conexão. Verifique sua internet e tente novamente.';
  return message;
}

document.getElementById('authSubmit').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const displayName = document.getElementById('authDisplayName').value.trim();
  const errorEl = document.getElementById('authError');
  const loadingEl = document.getElementById('authLoading');
  const submitBtn = document.getElementById('authSubmit');
  errorEl.textContent = '';

  if(!email || !password){ errorEl.textContent = 'Preencha e-mail e senha.'; return; }
  if(!isValidEmail(email)){ errorEl.textContent = 'Digite um e-mail válido.'; return; }
  if(authMode==='signup' && !displayName){ errorEl.textContent = 'Escolha um nome de exibição.'; return; }
  if(authMode==='signup' && password.length < 6){ errorEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if(authMode==='signup' && password !== document.getElementById('authConfirmPassword').value){
    errorEl.textContent = 'As senhas não coincidem.'; return;
  }

  submitBtn.disabled = true; loadingEl.style.display = 'block';
  try{
    if(authMode==='signup'){
      const username = email.split('@')[0] + '.' + Math.random().toString(36).slice(2,6);
      const result = await signUp({email, password, username, display_name: displayName});
      if(!result.session){
        errorEl.textContent = '';
        loadingEl.style.display = 'none';
        submitBtn.disabled = false;
        toast('Conta criada! Confira seu e-mail para confirmar o acesso, depois entre por aqui.');
        setAuthMode('login');
        return;
      }
    } else {
      await signIn({email, password});
    }
    await boot();
  }catch(err){
    errorEl.textContent = translateAuthError(err.message);
    console.error(err);
  }finally{
    submitBtn.disabled = false; loadingEl.style.display = 'none';
  }
});

// Keep the app in sync if the session changes in another tab, or expires.
supabase.auth.onAuthStateChange((_event, session) => {
  if(!session){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
  }
});

/* ---------------- INIT ---------------- */
boot();
</script>
