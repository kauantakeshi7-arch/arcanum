/* =========================================================
   MODO DISCRETO / COFRE OCULTO
   Três toques no brasão escondem o Arcanum atrás de uma calculadora real
   e funcional. Digitar o código pessoal (padrão 7777) seguido de "="
   devolve o Arcanum — sem operadores no meio, ou a calculadora só calcula.
   ========================================================= */
let brandTapCount = 0, brandTapTimer = null;
function handleBrandTap(){
  brandTapCount++;
  clearTimeout(brandTapTimer);
  brandTapTimer = setTimeout(()=>{ brandTapCount = 0; }, 1100);
  if(brandTapCount >= 3){
    brandTapCount = 0;
    enterStealth();
  }
}
let calcState = {expr:'0', pinBuffer:'', freshStart:true};
function enterStealth(){
  calcState = {expr:'0', pinBuffer:'', freshStart:true};
  renderCalcDisplay();
  document.getElementById('stealthScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authScreen').style.display = 'none';
}
function exitStealth(){
  document.getElementById('stealthScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  toast('Bem-vindo(a) de volta ao Arcanum ✦');
}
function renderCalcDisplay(){
  const el = document.getElementById('calcDisplay');
  if(el) el.textContent = calcState.expr;
}
function calcPress(val){
  const isDigit = /^[0-9.]$/.test(val);
  if(val === 'C'){
    calcState = {expr:'0', pinBuffer:'', freshStart:true};
  } else if(val === '='){
    if(calcState.pinBuffer && calcState.pinBuffer === state.profile.stealthPin){
      exitStealth();
      return;
    }
    try{
      const safe = calcState.expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/[^0-9+\-*/.]/g,'');
      // eslint-disable-next-line no-new-func — controlled input: only digits/operators from our own buttons ever reach `expr`.
      const result = Function('"use strict"; return (' + safe + ')')();
      calcState.expr = Number.isFinite(result) ? String(Math.round(result*1e10)/1e10) : 'Erro';
    }catch(e){ calcState.expr = 'Erro'; }
    calcState.pinBuffer = '';
    calcState.freshStart = true;
  } else if(val === '±'){
    calcState.expr = calcState.expr.startsWith('-') ? calcState.expr.slice(1) : '-' + calcState.expr;
  } else if(val === '%'){
    try{ calcState.expr = String(parseFloat(calcState.expr) / 100); }catch(e){}
  } else if(isDigit){
    calcState.pinBuffer += val;
    calcState.expr = calcState.freshStart ? val : calcState.expr + val;
    calcState.freshStart = false;
  } else {
    // Operator: a real math step, so this can no longer be "just the PIN".
    calcState.pinBuffer = '';
    calcState.expr = calcState.expr + val;
    calcState.freshStart = false;
  }
  renderCalcDisplay();
}

document.addEventListener('click', (e)=>{
  const calcBtn = e.target.closest('[data-calc]');
  if(calcBtn){ calcPress(calcBtn.dataset.calc); return; }

  // Modo Discreto: 3 toques rápidos no brasão do Arcanum (topbar ou menu
  // lateral) escondem o app inteiro atrás de uma calculadora de verdade.
  if(e.target.closest('.brand')){ handleBrandTap(); }

  const nav = e.target.closest('[data-nav]');
  if(nav){ setNav(nav.dataset.nav); return; }

  const feedtab = e.target.closest('[data-feedtab]');
  if(feedtab){ state.feedTab = feedtab.dataset.feedtab; renderAgora(); return; }

  const subtab = e.target.closest('[data-subtab]');
  if(subtab){ state.profileSubtab = subtab.dataset.subtab; renderPerfil(); return; }

  const act = e.target.closest('[data-action]');
  if(act){
    const action = act.dataset.action;
    const id = act.dataset.id;

    if(action==='like'){
      const post = state.posts.find(p=>p.id===id);
      const wasLiked = post.liked;
      post.liked = !wasLiked; post.blessings += post.liked?1:-1;
      renderAgora();
      const call = post.liked ? api.likePost(post.id, state.profile.id) : api.unlikePost(post.id, state.profile.id);
      if(post.liked && post.userId){
        api.createNotification(post.userId, state.profile.id, 'like', post.id).catch(console.error);
      }
      call.catch(err=>{
        post.liked = wasLiked; post.blessings += wasLiked?1:-1;
        toast('Não foi possível salvar sua reação. Tente de novo.');
        renderAgora();
        console.error(err);
      });
    }
    else if(action==='repost'){
      // Reposts have no backing table yet (see README "Próximas extensões") — local-only for now.
      const post = state.posts.find(p=>p.id===id);
      post.reposted = !post.reposted; post.reposts += post.reposted?1:-1;
      renderAgora();
    }
    else if(action==='save'){
      // "Guardar no grimório" as a bookmark also has no table yet — local-only for now.
      const post = state.posts.find(p=>p.id===id);
      post.saved = !post.saved;
      toast(post.saved ? 'Guardado no seu Grimório ✦' : 'Removido do Grimório');
      renderAgora();
    }
    else if(action==='toggle-comments'){
      const post = state.posts.find(p=>p.id===id);
      post._showComments = !post._showComments;
      renderAgora();
      if(post._showComments && !post._commentsLoaded){
        api.fetchComments(post.id).then(rows=>{
          post.comments = rows.map(r=>({n: r.profiles?.display_name || 'Alguém', t: r.content}));
          post._commentsLoaded = true;
          renderAgora();
        }).catch(err=>{ toast('Não foi possível carregar os comentários.'); console.error(err); });
      }
    }
    else if(action==='send-comment'){
      const input = document.querySelector(`[data-comment-input="${id}"]`);
      const val = input.value.trim();
      if(val){
        const post = state.posts.find(p=>p.id===id);
        api.addComment(post.id, state.profile.id, val).then(()=>{
          post.comments.push({n: state.profile.display_name, t: val});
          post._showComments = true;
          renderAgora();
          if(post.userId) api.createNotification(post.userId, state.profile.id, 'comment', post.id).catch(console.error);
        }).catch(err=>{ toast('Não foi possível enviar o comentário.'); console.error(err); });
      }
    }
    else if(action==='open-quiz'){ openQuiz(id); }
    else if(action==='open-lunar-quest'){ openLunarQuestModal(id); }
    else if(action==='buy-shop-item'){
      const cat = act.dataset.cat;
      const it = shopItem(cat, act.dataset.id);
      const key = `${cat}:${it.id}`;
      if(state.profile.unlockedItems.has(key)) return;
      if(state.profile.mana_xp < it.cost){ toast('Mana insuficiente para esse item.'); return; }
      const prevMana = state.profile.mana_xp;
      const prevLayers = {...state.profile.avatarLayers};
      state.profile.mana_xp -= it.cost;
      state.profile.unlockedItems.add(key);
      state.profile.avatarLayers[cat] = it.id;
      renderPerfil(); renderRightPanel();
      updateProfile(state.profile.id, {
        mana_xp: state.profile.mana_xp,
        unlocked_items: Array.from(state.profile.unlockedItems),
        avatar_layers: state.profile.avatarLayers
      }).then(()=>{
        toast(`${it.label} desbloqueado(a) ✦`);
      }).catch(err=>{
        state.profile.mana_xp = prevMana;
        state.profile.unlockedItems.delete(key);
        state.profile.avatarLayers = prevLayers;
        toast('Não foi possível concluir a compra agora.');
        console.error(err);
        renderPerfil(); renderRightPanel();
      });
    }
    else if(action==='equip-shop-item'){
      const cat = act.dataset.cat;
      const id = act.dataset.id;
      const prevLayers = {...state.profile.avatarLayers};
      state.profile.avatarLayers[cat] = id;
      renderPerfil(); renderRightPanel();
      updateProfile(state.profile.id, {avatar_layers: state.profile.avatarLayers}).catch(err=>{
        state.profile.avatarLayers = prevLayers;
        toast('Não foi possível usar esse item agora.');
        console.error(err);
        renderPerfil();
      });
    }
    else if(action==='draw-tarot-spread'){
      const shuffled = [...ORACLE_POOL].sort(()=>Math.random()-0.5);

        {pos:'Passado', card: shuffled[0]},
        {pos:'Presente', card: shuffled[1]},
        {pos:'Futuro', card: shuffled[2]}
      ];
      renderEgregora();
    }
    else if(action==='share-tarot-image'){
      const spread = state.tarotSpread;
      if(!spread) return;
      downloadCardImage('Mesa de Tarot — 3 Cartas', [
        `Passado: ${spread[0].card.name} — ${spread[0].card.meaning}`,
        `Presente: ${spread[1].card.name} — ${spread[1].card.meaning}`,
        `Futuro: ${spread[2].card.name} — ${spread[2].card.meaning}`
      ], 'arcanum-tarot.png');
    }
    else if(action==='view-profile'){ openProfileModal(id); }
    else if(action==='open-post-menu'){
      const post = state.posts.find(p=>p.id===id);
      if(post) openPostMenu(id, post.userId, post.user, state.blockedIds.has(post.userId));
    }
    else if(action==='follow-user'){
      const target = act.dataset.target;
      const wasFollowing = state.followingIds.has(target);
      if(wasFollowing){ state.followingIds.delete(target); state.followCounts.following = Math.max(0, state.followCounts.following-1); }
      else{ state.followingIds.add(target); state.followCounts.following += 1; }
      const rerender = act.dataset.rerender;
      if(rerender==='profile-modal') act.textContent = wasFollowing ? 'Seguir' : 'Deixar de seguir';
      else if(rerender==='find-people') act.textContent = wasFollowing ? 'Seguir' : 'Seguindo';
      else if(rerender==='agora') renderAgora();
      else if(rerender==='egregora') renderEgregora();
      const call = wasFollowing ? api.unfollowUser(state.profile.id, target) : api.followUser(state.profile.id, target);
      call.then(()=>{
        if(!wasFollowing) api.createNotification(target, state.profile.id, 'follow', null).catch(console.error);
      }).catch(err=>{
        if(wasFollowing){ state.followingIds.add(target); state.followCounts.following += 1; }
        else{ state.followingIds.delete(target); state.followCounts.following = Math.max(0, state.followCounts.following-1); }
        toast('Não foi possível concluir agora.');
        console.error(err);
      });
    }
    else if(action==='block-user'){ confirmBlockUser(act.dataset.target); }
    else if(action==='report-content'){ openReportModal(act.dataset.type, act.dataset.id); }
    else if(action==='edit-post'){ openEditPostModal(id); }
    else if(action==='delete-post'){ confirmDeletePost(id); }
    else if(action==='coven-post-menu'){ openCovenPostMenu(id); }
    else if(action==='edit-coven-post'){ openEditCovenPostModal(id); }

    else if(action==='close-modal'){ closeModal(); renderAll(); }
    else if(action==='set-candle'){ state.candleColor = act.dataset.color; renderSantuario(); }
    else if(action==='connect'){
      // No "connections" table yet — local-only for now (see README).
      const name = act.dataset.name;
      state.connections[name] = !state.connections[name];
      toast(state.connections[name] ? `Conectado(a) com ${name} ✦` : 'Conexão desfeita');
      renderEgregora();
    }
    else if(action==='light-candle'){
      const c = state.candles.find(c=>c.id===id);
      if(!c.lit){
        c.lit = true; c.lights++;
        renderEgregora();
        api.firmCandleLight(c.id, state.profile.id).then(()=>{
          toast('Pensamento firmado ✦');
          if(c.userId) api.createNotification(c.userId, state.profile.id, 'candle_light', c.id).catch(console.error);
        }).catch(err=>{
          c.lit = false; c.lights--;
          toast('Não foi possível firmar o pensamento agora.');
          renderEgregora();
          console.error(err);
        });
      }
    }
    else if(action==='toggle-coven'){
      const c = state.covens.find(c=>c.id===id);
      const wasJoined = c.joined;
      c.joined = !wasJoined; c.memberCount += c.joined?1:-1;
      renderCovens(); renderAgora();
      const call = c.joined ? api.joinCoven(c.id, state.profile.id) : api.leaveCoven(c.id, state.profile.id);
      call.then(()=>{
        toast(c.joined ? `Você entrou em ${c.name} ✦` : `Você saiu de ${c.name}`);
        if(c.joined && c.createdBy) api.createNotification(c.createdBy, state.profile.id, 'coven_join', c.id).catch(console.error);
      }).catch(err=>{
        c.joined = wasJoined; c.memberCount += wasJoined?1:-1;
        toast('Não foi possível atualizar sua entrada no coven.');
        renderCovens(); renderAgora();
        console.error(err);
      });
    }
    else if(action==='open-coven'){ openCovenWall(id); }
    else if(action==='coven-like'){ toggleCovenLike(id); }
    else if(action==='coven-toggle-comments'){ toggleCovenComments(id); }
    else if(action==='coven-send-comment'){ sendCovenComment(id); }
    else if(action==='coven-toggle-mod'){ handleCovenToggleMod(document.getElementById('covenMembersList')?.dataset.covenId, act.dataset.uid, act.dataset.role); }
    else if(action==='coven-remove-member'){ handleCovenRemoveMember(document.getElementById('covenMembersList')?.dataset.covenId, act.dataset.uid); }
    else if(action==='filter-covens'){ state.covenFilter = act.dataset.trad; renderCovens(); }
    else if(action==='go-covens'){ setNav('covens'); }
    else if(action==='open-notif'){
      const type = act.dataset.type, target = act.dataset.target, actor = act.dataset.actor, name = act.dataset.name;
      closeModal();
      if(type==='follow'){ openProfileModal(actor); }
      else if(type==='message'){ api.getOrCreateConversation(state.profile.id, actor).then(convo=> openDmThread(convo.id, actor, name)).catch(console.error); }
      else if(['coven_join','coven_promote','coven_remove','coven_post_like','coven_post_comment'].includes(type)){
        if(target) openCovenWall(target);
      }
    }
    else if(action==='dismiss-onboarding'){ localStorage.setItem('arcanum_onboarding_dismissed', '1'); renderAgora(); }
    else if(action==='onboarding-follow'){ openFindPeopleModal(); }
    else if(action==='onboarding-coven'){ setNav('covens'); }
    else if(action==='onboarding-post'){ openNewPostModal(); }
    else if(action==='add-story'){ openNewStoryModal(); }
    else if(action==='view-story'){ openStoryViewer(act.dataset.user); }
    else if(action==='send-flower'){
      const g = state.gratitude.find(g=>g.id===id);
      if(!g.sent){
        g.sent = true; g.flowers++;
        renderEgregora();
        api.sendFlower(g.id, state.profile.id).then(()=>{
          if(g.userId) api.createNotification(g.userId, state.profile.id, 'connection', g.id).catch(console.error);
        }).catch(err=>{
          g.sent = false; g.flowers--;
          toast('Não foi possível enviar a flor agora.');
          renderEgregora();
          console.error(err);
        });
      }
    }
  }

  if(e.target.id==='btnStartDuel') startDuel();
  if(e.target.id==='audioChip' || e.target.closest('#audioChip')) openAudioMenu();
  if(e.target.id==='sideAudioChip' || e.target.closest('#sideAudioChip')) openAudioMenu();
  if(e.target.id==='miniPlayBtn' || e.target.closest('#miniPlayBtn')) toggleAudio();
  if(e.target.id==='btnNotif' || e.target.closest('#btnNotif')) openNotifications();
  if(e.target.id==='btnGlobalSearch' || e.target.closest('#btnGlobalSearch')) openGlobalSearchModal();
  if(e.target.id==='btnDM' || e.target.closest('#btnDM')) openDMs();
  if(e.target.id==='fabNewPost' || e.target.closest('#fabNewPost')) openNewPostModal();
  if(e.target.id==='sideFabNewPost' || e.target.closest('#sideFabNewPost')){ setNav('agora'); openNewPostModal(); }
  if(e.target.id==='btnRevealOracle') revealOracle();
  if(e.target.id==='btnNewGrim') openNewGrimoireModal();
  if(e.target.id==='btnExportGrimoire') exportGrimoirePDF();
  if(e.target.id==='btnAskVeil'){
    const input = document.getElementById('veilQuestionInput');
    const category = document.getElementById('veilCategory').value;
    const q = input.value.trim();
    if(!q){ toast('Escreva sua pergunta ao Guardião.'); return; }
    state.veilCategory = category;
    askVeil(category, q);
  }
  if(e.target.id==='btnCopyInvite'){
    const input = document.getElementById('inviteLinkInput');
    input.select();
    navigator.clipboard?.writeText(input.value).then(()=>{
      toast('Link de convite copiado ✦');
    }).catch(()=>{
      toast('Selecione e copie o link manualmente.');
    });
  }
  if(e.target.id==='btnNewCandle') addNewCandle();
  if(e.target.id==='btnNewCoven') openNewCovenModal();
  if(e.target.id==='btnAddSacredPlace') openNewSacredPlaceModal();
  if(e.target.id==='btnNewGratitude') openNewGratitudeModal();
  if(e.target.id==='btnMoonNotify'){
    state.moonNotify = !state.moonNotify;
    toast(state.moonNotify ? 'Você será lembrado do ritual da Lua Cheia' : 'Lembrete removido');
    renderEgregora();
  }
  if(e.target.closest('#btnInstallApp, #btnInstallBanner')){ triggerInstall(); }
  if(e.target.closest('#btnDismissInstallBanner')){
    localStorage.setItem('arcanum_install_dismissed', String(Date.now()));
    renderInstallBanner();
  }
  if(e.target.id==='btnLogout'){
    signOut().then(()=>{ window.location.reload(); }).catch(err=>{ toast('Não foi possível sair agora.'); console.error(err); });
  }
  if(e.target.id==='btnTestStealth'){ enterStealth(); }
  if(e.target.id==='btnSaveStealthPin'){
    const input = document.getElementById('stealthPinInput');
    const pin = input.value.trim();
    if(!/^[0-9]{4,8}$/.test(pin)){ toast('O código precisa ter só números, de 4 a 8 dígitos.'); return; }
    const prev = state.profile.stealthPin;

    updateProfile(state.profile.id, {stealth_pin: pin}).then(()=>{

});

const NOTIF_TEXT = {
  like: (n)=>`<b style="color:var(--text-hi)">${n}</b> ressoou (Axé) com sua publicação.`,
  comment: (n)=>`<b style="color:var(--text-hi)">${n}</b> comentou em sua publicação.`,
  candle_light: (n)=>`<b style="color:var(--text-hi)">${n}</b> acendeu uma luz na sua firmeza.`,
  connection: (n)=>`<b style="color:var(--text-hi)">${n}</b> quer se conectar com você.`,
  message: (n)=>`<b style="color:var(--text-hi)">${n}</b> enviou uma mensagem.`,
  follow: (n)=>`<b style="color:var(--text-hi)">${n}</b> passou a seguir você.`,
  coven_join: (n)=>`<b style="color:var(--text-hi)">${n}</b> entrou no seu coven.`,
  coven_promote: (n)=>`<b style="color:var(--text-hi)">${n}</b> te tornou moderador(a) de um coven.`,
  coven_remove: (n)=>`<b style="color:var(--text-hi)">${n}</b> te removeu de um coven.`,
  coven_post_like: (n)=>`<b style="color:var(--text-hi)">${n}</b> ressoou (Axé) com sua publicação no coven.`,
  coven_post_comment: (n)=>`<b style="color:var(--text-hi)">${n}</b> comentou em sua publicação no coven.`,
  story_view: (n)=>`<b style="color:var(--text-hi)">${n}</b> viu sua story.`
};
const NOTIF_NAVIGABLE = new Set(['follow','coven_join','coven_promote','coven_remove','coven_post_like','coven_post_comment','message']);
async function openNotifications(){
  openModal(`<div class="modal-title">Notificações</div><div id="notifList" class="empty-hint">Carregando…</div>`);
  try{
    const rows = await api.fetchNotifications(state.profile.id);
    const list = document.getElementById('notifList');
    if(!list) return; // modal was closed before the fetch resolved
    if(!rows.length){
      list.className = 'empty-hint';
      list.textContent = 'Nenhuma notificação ainda.';
    } else {
      list.className = '';
      list.innerHTML = rows.map(r=>{
        const name = escapeHtml(r.profiles?.display_name || 'Alguém');
        const textFn = NOTIF_TEXT[r.type];
        const clickable = NOTIF_NAVIGABLE.has(r.type);
        return `<div class="reflection-item ${r.is_read?'':'notif-unread'}" ${clickable?`data-action="open-notif" data-type="${r.type}" data-target="${r.target_id||''}" data-actor="${r.actor_id}" data-name="${name}" style="cursor:pointer"`:''}>${textFn?textFn(name):'Nova notificação'}<div class="reflection-date">${relativeTime(r.created_at)}</div></div>`;
      }).join('');
    }
    if(rows.some(r=>!r.is_read)){
      await api.markNotificationsRead(state.profile.id);
      refreshBadgeCounts();
    }
  }catch(err){
    console.error(err);
    const list = document.getElementById('notifList');
    if(list){ list.className='empty-hint'; list.textContent = 'Não foi possível carregar as notificações.'; }
  }
}

function openGlobalSearchModal(){
  openModal(`<div class="modal-title">Buscar</div>
    <div class="form-field"><input type="text" id="globalSearchInput" placeholder="Pessoas, covens ou publicações…" autocomplete="off"></div>
    <div id="globalSearchResults" class="empty-hint">Digite ao menos 2 letras.</div>`);
  const input = document.getElementById('globalSearchInput');
  requestAnimationFrame(()=>input.focus());
  let debounce;
  input.addEventListener('input', ()=>{
    clearTimeout(debounce);
    debounce = setTimeout(runGlobalSearch, 300);
  });
  async function runGlobalSearch(){
    const q = input.value.trim();
    const results = document.getElementById('globalSearchResults');
    if(!results) return;
    if(q.length < 2){ results.className = 'empty-hint'; results.textContent = 'Digite ao menos 2 letras.'; return; }
    const qLower = q.toLowerCase();
    const covenMatches = state.covens.filter(c=>c.name.toLowerCase().includes(qLower)).slice(0, 8);
    const postMatches = state.posts.filter(p=>(p.content||'').toLowerCase().includes(qLower)).slice(0, 8);
    let peopleMatches = [];
    try{ peopleMatches = await api.searchProfiles(q, state.profile.id); }catch(err){ console.error(err); }
    if(!results.isConnected) return;
    if(!peopleMatches.length && !covenMatches.length && !postMatches.length){
      results.className = 'empty-hint'; results.textContent = 'Nada encontrado.'; return;
    }
    results.className = '';
    results.innerHTML = `
      ${peopleMatches.length ? `<div class="section-sub" style="margin:10px 0 6px">Pessoas</div>${peopleMatches.map(p=>`
        <button class="dm-convo-row" data-action="view-profile" data-id="${p.id}">
          <div class="avatar-sm" style="background:${tradColor('solitario')}">${initials(p.display_name)}</div>
          <div class="dm-convo-info"><div class="dm-convo-name">${escapeHtml(p.display_name)}</div></div>
        </button>`).join('')}` : ''}
      ${covenMatches.length ? `<div class="section-sub" style="margin:10px 0 6px">Covens</div>${covenMatches.map(c=>{
        const col = tradColor(c.tradition);
        return `<button class="dm-convo-row" data-action="open-coven" data-id="${c.id}">
          <div class="avatar-sm" style="background:${col}22; color:${col}">${GLYPH[c.tradition]||'✦'}</div>
          <div class="dm-convo-info"><div class="dm-convo-name">${escapeHtml(c.name)}</div></div>
        </button>`;
      }).join('')}` : ''}
      ${postMatches.length ? `<div class="section-sub" style="margin:10px 0 6px">Publicações</div>${postMatches.map(p=>`
        <div class="reflection-item"><b style="color:var(--text-hi)">${escapeHtml(p.user)}</b><div class="reflection-date">${p.time}</div>${escapeHtml(p.content).slice(0,140)}</div>
      `).join('')}` : ''}
    `;
  }
}

/* ---------------- BADGES / CONQUISTAS ---------------- */
const BADGE_DEFS = [
  {id:'buscador', label:'Buscador Dedicado', icon:'✦', hint:'Alcance 120 Mana', test:s=>s.mana_xp>=120},
  {id:'adepto', label:'Adepto do Caminho', icon:'🔥', hint:'Alcance 480 Mana', test:s=>s.mana_xp>=480},
  {id:'chama7', label:'Guardião da Chama', icon:'🕯️', hint:'7 dias de Chama Sagrada', test:s=>s.streak_days>=7},
  {id:'chama30', label:'Chama Eterna', icon:'🌟', hint:'30 dias de Chama Sagrada', test:s=>s.streak_days>=30},
  {id:'fundador', label:'Fundador de Coven', icon:'🏛️', hint:'Funde um Coven', test:s=>s.covensFounded>=1},
  {id:'lunar', label:'Andarilho Lunar', icon:'🌙', hint:'Complete as 4 missões do Passe Lunar', test:s=>s.lunarCompletions>=4},
  {id:'gratidao', label:'Voz de Gratidão', icon:'🙏', hint:'Registre uma Graça Alcançada', test:s=>s.gratitudeCount>=1},
  {id:'chamas5', label:'Chama Compartilhada', icon:'💫', hint:'Acenda 5 velas no Mural de Firmezas', test:s=>s.candleLights>=5}
];
function computeBadges(stats){ return BADGE_DEFS.map(b=>({...b, achieved: b.test(stats)})); }
function renderBadgesGrid(stats){
  const badges = computeBadges(stats);
  return `<div class="badges-grid">${badges.map(b=>`
    <div class="badge-item ${b.achieved?'achieved':'locked'}" title="${b.achieved?b.label:b.hint}">
      <div class="badge-icon">${b.icon}</div>
      <div class="badge-label">${b.label}</div>
    </div>
  `).join('')}</div>`;
}

async function openDmThread(conversationId, otherId, otherName){
  stopDmThreadSub();
  state.openDmConversationId = conversationId;
  openModal(`<div class="modal-title">${escapeHtml(otherName)}</div>
    <div id="dmMessages" class="dm-messages"></div>
    <div class="comment-input-row"><input type="text" id="dmInput" placeholder="Escreva com respeito…" autocomplete="off"><button id="dmSendBtn">Enviar</button></div>`);
  const box = document.getElementById('dmMessages');
  async function renderMessages(){
    if(!box.isConnected) return;
    const rows = await api.fetchMessages(conversationId);
    box.innerHTML = rows.length ? rows.map(m=>
      `<div class="dm-bubble ${m.sender_id===state.profile.id?'me':''}">${escapeHtml(m.content)}</div>`
    ).join('') : '<div class="empty-hint">Nenhuma mensagem ainda. Diga olá ✦</div>';
    box.scrollTop = box.scrollHeight;
  }
  try{
    await renderMessages();
    await api.markMessagesRead(conversationId, state.profile.id);
    refreshBadgeCounts();
  }catch(err){ console.error(err); }
  dmThreadUnsub = api.subscribeToMessages(conversationId, (msg)=>{
    if(msg.sender_id !== state.profile.id){
      renderMessages();
      api.markMessagesRead(conversationId, state.profile.id).then(refreshBadgeCounts).catch(console.error);
    }
  });
  async function send(){
    const input = document.getElementById('dmInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    try{
      await api.sendMessage(conversationId, state.profile.id, text);
      await renderMessages();
      api.createNotification(otherId, state.profile.id, 'message', conversationId).catch(console.error);
    }catch(err){ console.error(err); toast('Não foi possível enviar a mensagem.'); }
  }
  document.getElementById('dmSendBtn').addEventListener('click', send);
  document.getElementById('dmInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
}

/* ---------- New Grimoire Entry ---------- */
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  for(let n=0; n<words.length; n++){
    const testLine = line + words[n] + ' ';
    if(ctx.measureText(testLine).width > maxWidth && n > 0){
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
  return y + lineHeight;
}
function downloadCardImage(title, lines, filename){
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 1000;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 1000);
  grad.addColorStop(0, '#12352A'); grad.addColorStop(1, '#061410');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 1000);
  ctx.strokeStyle = 'rgba(212,168,83,0.4)'; ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, 760, 960);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8C989';
  ctx.font = '600 28px Georgia, serif';
  ctx.fillText('✦ ARCANUM ✦', 400, 90);
  ctx.font = '600 24px Georgia, serif';
  ctx.fillStyle = '#D4A853';
  let y = wrapCanvasText(ctx, title, 400, 160, 680, 32) + 20;
  ctx.font = '16px Georgia, serif';
  ctx.fillStyle = '#EDEAE3';
  lines.forEach(line=>{
    y = wrapCanvasText(ctx, line, 400, y, 680, 24) + 26;
  });
  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillStyle = '#8B87A0';
  ctx.fillText('arcanum-mu.vercel.app', 400, 955);
  canvas.toBlob(blob=>{
    if(!blob){ toast('Não foi possível gerar a imagem.'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }, 'image/png');
}

let covenWallState = null; // {covenId, posts, photoBlob, expanded:Set}
function covenPostCardHtml(p){

  const liked = state.myCovenPostLikeIds.has(p.id);
  const expanded = covenWallState.expanded.has(p.id);

          <div class="post-sub"><span class="post-time">${relativeTime(p.created_at)}</span></div>
        </div>
      </div>
      ${p.user_id===state.profile.id ? `<button class="post-kebab" data-action="coven-post-menu" data-id="${p.id}" aria-label="Mais opções">⋯</button>` : ''}
    </div>
    <div class="post-text">${escapeHtml(p.content)}</div>

        <span>${p.likes_count||0} Axé</span>
      </button>
      <button class="reaction-btn grow" data-action="coven-toggle-comments" data-id="${p.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span>${p.comments_count||0}</span>
      </button>
    </div>
    <div class="comments-box" style="display:${expanded?'block':'none'}">
      ${expanded ? (commentsHtml || (p._commentsLoaded ? '<div class="empty-hint" style="padding:4px 0">Nenhum comentário ainda.</div>' : 'Carregando…')) : ''}
      ${expanded ? `<div class="comment-input-row">
        <input type="text" placeholder="Escreva com respeito…" aria-label="Escrever comentário" data-coven-comment-input="${p.id}">

function renderCovenWallList(){
  const list = document.getElementById('covenWallList');
  if(!list || !covenWallState) return;
  const posts = covenWallState.posts;
  if(!posts.length){ list.className='empty-hint'; list.innerHTML='Nenhuma publicação ainda. Seja a primeira voz.'; return; }
  list.className = '';
  list.innerHTML = posts.map(covenPostCardHtml).join('');
}
async function openCovenWall(covenId){
  const coven = state.covens.find(c=>c.id===covenId);
  if(!coven) return;
  if(!coven.joined){ toast('Entre no coven para ver o mural.'); return; }
  const isFounder = coven.createdBy === state.profile.id;
  covenWallState = { covenId, posts: [], photoBlob: null, expanded: new Set() };
  openModal(`<div class="modal-title">${escapeHtml(coven.name)}</div>
    <div class="node-sub" style="margin-bottom:12px">${tradLabel(coven.tradition)} · ${coven.memberCount} membro${coven.memberCount===1?'':'s'}</div>
    <div style="display:flex; gap:8px; margin-bottom:14px">
      <button class="btn-ghost" style="flex:1" id="btnCovenMembers">👥 Membros</button>
      ${isFounder ? `<button class="btn-ghost" style="flex:1" id="btnEditCoven">⚙ Editar</button>` : ''}
    </div>
    ${coven.pinnedAnnouncement ? `<div class="coven-pinned">📌 ${escapeHtml(coven.pinnedAnnouncement)}</div>` : ''}
    <div class="form-field" style="margin-bottom:8px">
      <textarea id="covenPostInput" placeholder="Compartilhe algo com o coven…" maxlength="1000"></textarea>
    </div>
    <div id="covenPhotoPreview"></div>
    <div style="display:flex; gap:8px; margin-bottom:16px">
      <button class="btn-ghost" id="btnAddCovenPhoto" style="flex:1">📷 Foto</button>
      <button class="btn-primary" id="btnCovenPost" style="flex:1; margin-top:0">Publicar</button>
    </div>
    <input type="file" id="covenPhotoInput" accept="image/*" style="display:none">
    <div id="covenWallList" class="empty-hint">Carregando…</div>`);

  document.getElementById('btnCovenMembers').addEventListener('click', ()=> openCovenMembersModal(covenId));
  const editBtn = document.getElementById('btnEditCoven');
  if(editBtn) editBtn.addEventListener('click', ()=> openEditCovenModal(covenId));

  const photoInput = document.getElementById('covenPhotoInput');
  document.getElementById('btnAddCovenPhoto').addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    try{
      covenWallState.photoBlob = await compressImageToWebP(file);
      document.getElementById('covenPhotoPreview').innerHTML =
        `<img src="${URL.createObjectURL(covenWallState.photoBlob)}" alt="" style="width:100%; max-height:180px; object-fit:cover; border-radius:12px; margin-bottom:8px">`;
    }catch(err){ console.error(err); toast('Não foi possível processar essa imagem.'); }
  });

  document.getElementById('btnCovenPost').addEventListener('click', async (ev)=>{
    const input = document.getElementById('covenPostInput');
    const val = input.value.trim();
    if(!val){ toast('Escreva algo para publicar.'); return; }
    const btn = ev.currentTarget;
    btn.disabled = true; btn.textContent = 'Publicando…';
    try{
      let mediaUrl = null;
      if(covenWallState.photoBlob) mediaUrl = await api.uploadCovenPostMedia(state.profile.id, covenWallState.photoBlob);
      const row = await api.postToCoven(covenId, state.profile.id, val, mediaUrl);
      input.value = '';
      covenWallState.photoBlob = null;
      document.getElementById('covenPhotoPreview').innerHTML = '';
      covenWallState.posts.unshift({
        id: row.id, user_id: state.profile.id, content: row.content, media_url: row.media_url, created_at: row.created_at,
        author_name: state.profile.display_name, likes_count: 0, comments_count: 0
      });
      renderCovenWallList();
    }catch(err){ console.error(err); toast('Não foi possível publicar no coven.'); }
    finally{ btn.disabled = false; btn.textContent = 'Publicar'; }
  });

  try{
    const rows = await api.fetchCovenPosts(covenId);
    if(covenWallState && covenWallState.covenId===covenId){
      covenWallState.posts = rows;
      renderCovenWallList();
    }
  }catch(err){
    console.error(err);
    const list = document.getElementById('covenWallList');
    if(list){ list.className='empty-hint'; list.textContent='Não foi possível carregar o mural.'; }
  }
}
async function toggleCovenComments(postId){
  if(!covenWallState) return;
  const post = covenWallState.posts.find(p=>p.id===postId);
  if(!post) return;
  if(covenWallState.expanded.has(postId)) covenWallState.expanded.delete(postId);
  else covenWallState.expanded.add(postId);
  renderCovenWallList();
  if(covenWallState.expanded.has(postId) && !post._commentsLoaded){
    try{
      const comments = await api.fetchCovenPostComments(postId);
      post._comments = comments;
      post._commentsLoaded = true;
      renderCovenWallList();
    }catch(err){ console.error(err); }
  }
}
async function sendCovenComment(postId){
  if(!covenWallState) return;
  const input = document.querySelector(`[data-coven-comment-input="${postId}"]`);
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  try{
    const row = await api.postCovenComment(postId, state.profile.id, val);
    const post = covenWallState.posts.find(p=>p.id===postId);
    if(post){
      post._comments = [...(post._comments||[]), {...row, author_name: state.profile.display_name}];
      post.comments_count = (post.comments_count||0) + 1;
      renderCovenWallList();
      if(post.user_id) api.createNotification(post.user_id, state.profile.id, 'coven_post_comment', covenWallState.covenId).catch(console.error);
    }
  }catch(err){ console.error(err); toast('Não foi possível comentar agora.'); }
}
async function toggleCovenLike(postId){
  if(!covenWallState) return;
  const post = covenWallState.posts.find(p=>p.id===postId);
  if(!post) return;
  const wasLiked = state.myCovenPostLikeIds.has(postId);
  if(wasLiked){ state.myCovenPostLikeIds.delete(postId); post.likes_count = Math.max(0, (post.likes_count||0)-1); }
  else{ state.myCovenPostLikeIds.add(postId); post.likes_count = (post.likes_count||0)+1; }
  renderCovenWallList();
  const call = wasLiked ? api.unlikeCovenPost(postId, state.profile.id) : api.likeCovenPost(postId, state.profile.id);
  call.then(()=>{
    if(!wasLiked && post.user_id) api.createNotification(post.user_id, state.profile.id, 'coven_post_like', covenWallState.covenId).catch(console.error);
  }).catch(err=>{
    if(wasLiked){ state.myCovenPostLikeIds.add(postId); post.likes_count = (post.likes_count||0)+1; }
    else{ state.myCovenPostLikeIds.delete(postId); post.likes_count = Math.max(0, (post.likes_count||0)-1); }
    renderCovenWallList();
    toast('Não foi possível concluir agora.');
    console.error(err);
  });
}

   AUTH GATE + DATA LOADING (real Supabase wiring)
   ========================================================= */
function relativeTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'agora';
  if(mins < 60) return `há ${mins}min`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `há ${hours}h`;
  return `há ${Math.floor(hours/24)}d`;
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}

  }));

  }));

  }));
  state.storyViewIds = myStoryViewIds;
  const storyGroups = new Map();
  stories.filter(row => !blockedIds.has(row.user_id)).forEach(row => {
    if(!storyGroups.has(row.user_id)){
      storyGroups.set(row.user_id, {
        userId: row.user_id,
        name: row.profiles?.display_name || 'Alguém',
        trad: row.profiles?.religion_path || 'solitario',
        verified: !!row.profiles?.is_verified,

      });

      id: row.id, mediaUrl: row.media_url, textContent: row.text_content,
      bgColor: row.bg_color, createdAt: row.created_at
    });
  });
  state.storiesByUser = Array.from(storyGroups.values());

    sun: profile.sun_sign || '—',
    moon: profile.moon_sign || '—',
    asc: profile.ascendant_sign || '—',
    stealthPin: profile.stealth_pin || '7777',
    isVerified: !!profile.is_verified,
    avatarLayers: profile.avatar_layers || {aura:'default', robe:'default', item:'default', familiar:'egg'},
    unlockedItems: new Set(profile.unlocked_items || ['aura:default','robe:default','item:default']),
    // "Já registrou hoje" is derived from the DB date, so refreshing the
    // page doesn't let someone re-trigger the streak bonus the same day.
    loggedToday: profile.logged_today_at === new Date().toISOString().slice(0,10)
  };
}

async function boot(){
  let session;
  try { session = await getSession(); }
  catch(err){ console.error(err); session = null; }

  if(!session){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
    return;
  }

  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  try{
    // A session can exist here without a profiles row yet — e.g. the user
    // confirmed their e-mail via the link and landed back with a session
    // Supabase created automatically, bypassing signIn()/signUp() (the only
    // two places that used to call ensureProfile). Always ensure it first.
    const meta = session.user.user_metadata || {};
    await ensureProfile(session.user.id, {
      username: meta.username || (session.user.email.split('@')[0] + '.' + session.user.id.slice(0, 4)),
      display_name: meta.display_name || session.user.email.split('@')[0]
    });
    await loadAppData(session.user.id);
    renderAll();
    refreshBadgeCounts();
    if(window.__notifUnsub) window.__notifUnsub();
    window.__notifUnsub = api.subscribeToNotifications(session.user.id, ()=>{ refreshBadgeCounts(); });
  }catch(err){
    console.error(err);
    toast('Não foi possível carregar seus dados do Supabase. Veja o console.');
  }
}

/* ---------- Auth screen wiring ---------- */
let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('active', t.dataset.authtab===mode));
  document.getElementById('authUsernameField').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('authConfirmField').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('pwStrengthWrap').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = mode==='signup' ? 'Criar conta' : 'Entrar';
  document.getElementById('authError').textContent = '';
  if(mode==='login'){
    document.getElementById('authConfirmPassword').value = '';
    document.getElementById('authConfirmHint').textContent = '';
    document.getElementById('authConfirmPassword').closest('.auth-input-wrap').classList.remove('valid','invalid');
  }
}
document.querySelectorAll('.auth-tab').forEach(t=>t.addEventListener('click', ()=>setAuthMode(t.dataset.authtab)));

const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
document.querySelectorAll('[data-pw-toggle]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const input = document.getElementById(btn.dataset.pwToggle);
    const willShow = input.type === 'password';
    input.type = willShow ? 'text' : 'password';
    btn.setAttribute('aria-pressed', String(willShow));
    btn.setAttribute('aria-label', willShow ? 'Ocultar senha' : 'Mostrar senha');
    btn.innerHTML = willShow ? EYE_OFF : EYE_OPEN;
  });
});

// ---- Real-time validation: email format ----
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function validateEmailField(){
  const input = document.getElementById('authEmail');
  const wrap = input.closest('.auth-input-wrap');
  const hint = document.getElementById('authEmailHint');
  const val = input.value.trim();
  wrap.classList.remove('valid','invalid');
  hint.className = 'auth-field-hint';
  if(!val){ hint.textContent = ''; return; }
  if(isValidEmail(val)){ wrap.classList.add('valid'); hint.textContent = ''; }
  else { wrap.classList.add('invalid'); hint.classList.add('error'); hint.textContent = 'E-mail em formato inválido.'; }
}
document.getElementById('authEmail').addEventListener('input', validateEmailField);
document.getElementById('authEmail').addEventListener('blur', validateEmailField);

// ---- Password strength meter (signup only) ----
function passwordScore(pw){
  let score = 0;
  if(pw.length >= 6) score++;
  if(pw.length >= 10) score++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if(/\d/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  return Math.min(score, 4);
}
function updatePasswordStrength(){
  const pw = document.getElementById('authPassword').value;
  const bars = document.querySelectorAll('#pwStrengthBars span');
  const label = document.getElementById('pwStrengthLabel');
  if(!pw){ bars.forEach(b=>b.className=''); label.textContent = ''; return; }
  const score = passwordScore(pw);
  const filled = Math.max(1, score);
  const tier = score<=1 ? 'weak' : score===2 ? 'fair' : score===3 ? 'good' : 'strong';
  const cls = {weak:'f-weak', fair:'f-fair', good:'f-good', strong:'f-strong'}[tier];
  bars.forEach((b,i)=>{ b.className = i<filled ? cls : ''; });
  const labels = {weak:'Fraca', fair:'Razoável', good:'Boa', strong:'Forte'};
  const colors = {weak:'var(--danger)', fair:'#C1874A', good:'var(--gold-soft)', strong:'var(--emerald)'};
  label.textContent = 'Força da senha: ' + labels[tier];
  label.style.color = colors[tier];
}
document.getElementById('authPassword').addEventListener('input', ()=>{
  updatePasswordStrength();
  if(authMode==='signup') validateConfirmField();
});

// ---- Confirm password match (signup only) ----
function validateConfirmField(){
  const input = document.getElementById('authConfirmPassword');
  const wrap = input.closest('.auth-input-wrap');
  const hint = document.getElementById('authConfirmHint');
  const pw = document.getElementById('authPassword').value;
  const cpw = input.value;
  wrap.classList.remove('valid','invalid');
  hint.className = 'auth-field-hint';
  if(!cpw){ hint.textContent = ''; return; }
  if(cpw === pw){ wrap.classList.add('valid'); hint.textContent = ''; }
  else { wrap.classList.add('invalid'); hint.classList.add('error'); hint.textContent = 'As senhas não coincidem.'; }
}
document.getElementById('authConfirmPassword').addEventListener('input', validateConfirmField);

// Supabase Auth error messages come back in English — translate the common
// ones so the whole login/signup flow reads in Portuguese like the rest of the app.
function translateAuthError(message){
  if(!message) return 'Não foi possível autenticar. Tente novamente.';
  const m = message.toLowerCase();
  const waitMatch = message.match(/after (\d+) seconds?/i);
  if(waitMatch) return `Por segurança, aguarde ${waitMatch[1]} segundos e tente de novo.`;
  if(m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if(m.includes('already registered') || m.includes('already exists')) return 'Este e-mail já está cadastrado. Tente entrar.';
  if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar — verifique sua caixa de entrada.';
  if(m.includes('password should be at least') || m.includes('password is too short')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('unable to validate email address') || m.includes('invalid email')) return 'Digite um e-mail válido.';
  if(m.includes('email rate limit exceeded')) return 'Muitas tentativas com este e-mail. Aguarde alguns minutos e tente de novo.';
  if(m.includes('user not found')) return 'Não encontramos uma conta com esse e-mail.';
  if(m.includes('network') || m.includes('fetch')) return 'Falha de conexão. Verifique sua internet e tente novamente.';
  return message;
}

document.getElementById('authSubmit').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const displayName = document.getElementById('authDisplayName').value.trim();
  const errorEl = document.getElementById('authError');
  const loadingEl = document.getElementById('authLoading');
  const submitBtn = document.getElementById('authSubmit');
  errorEl.textContent = '';

  if(!email || !password){ errorEl.textContent = 'Preencha e-mail e senha.'; return; }
  if(!isValidEmail(email)){ errorEl.textContent = 'Digite um e-mail válido.'; return; }
  if(authMode==='signup' && !displayName){ errorEl.textContent = 'Escolha um nome de exibição.'; return; }
  if(authMode==='signup' && password.length < 6){ errorEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
  if(authMode==='signup' && password !== document.getElementById('authConfirmPassword').value){
    errorEl.textContent = 'As senhas não coincidem.'; return;
  }

  submitBtn.disabled = true; loadingEl.style.display = 'block';
  try{
    if(authMode==='signup'){
      const username = email.split('@')[0] + '.' + Math.random().toString(36).slice(2,6);
      const referredBy = new URLSearchParams(window.location.search).get('ref') || null;
      const result = await signUp({email, password, username, display_name: displayName, referredBy});
      if(!result.session){
        errorEl.textContent = '';
        loadingEl.style.display = 'none';
        submitBtn.disabled = false;
        toast('Conta criada! Confira seu e-mail para confirmar o acesso, depois entre por aqui.');
        setAuthMode('login');
        return;
      }
    } else {
      await signIn({email, password});
    }
    await boot();
  }catch(err){
    errorEl.textContent = translateAuthError(err.message);
    console.error(err);
  }finally{
    submitBtn.disabled = false; loadingEl.style.display = 'none';
  }
});

// Keep the app in sync if the session changes in another tab, or expires.
supabase.auth.onAuthStateChange((_event, session) => {
  if(!session){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
  }
});
